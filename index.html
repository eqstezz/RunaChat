<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RunaChat — Мессенджер</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg: #0b0f15;
            --surface: #141a21;
            --surface2: #1c232c;
            --border: #2a3340;
            --text: #e8edf2;
            --text-dim: #8895a6;
            --accent: #2b7aff;
            --accent-glow: #1a5fd9;
            --dev-blue: #2b7aff;
            --green: #25d366;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        body {
            font-family:'Inter',sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0;
            padding:16px;
        }
        .app-container {
            width:100%;
            max-width:480px;
            height:92vh;
            max-height:820px;
            background:var(--surface);
            border-radius:var(--radius);
            border:1px solid var(--border);
            display:flex;
            flex-direction:column;
            overflow:hidden;
            box-shadow:var(--shadow);
            position:relative;
        }
        /* ===== HEADER ===== */
        .header {
            padding:16px 20px;
            border-bottom:1px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:var(--surface2);
            flex-shrink:0;
        }
        .header-logo {
            font-weight:800;
            font-size:1.2rem;
            background:linear-gradient(135deg,#2b7aff,#8b5cf6);
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            letter-spacing:-0.5px;
            cursor:default;
        }
        .header-actions {
            display:flex;
            align-items:center;
            gap:8px;
        }
        .server-status {
            display:flex;
            align-items:center;
            gap:6px;
            font-size:0.6rem;
            color:var(--text-dim);
            font-weight:500;
            background:rgba(43,122,255,0.08);
            padding:4px 12px;
            border-radius:20px;
            border:1px solid rgba(43,122,255,0.15);
        }
        .status-dot {
            width:7px;
            height:7px;
            border-radius:50%;
            background:var(--green);
            box-shadow:0 0 8px rgba(37,211,102,0.5);
            animation:dotPulse 2s infinite;
        }
        @keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }
        /* ===== AUTH SCREEN ===== */
        .screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
        .screen.active { display:flex; }
        .form-container {
            padding:28px 24px;
            gap:20px;
            display:flex;
            flex-direction:column;
            overflow-y:auto;
            flex:1;
            justify-content:center;
        }
        .cyber-input-group {
            width:100%;
            position:relative;
        }
        .cyber-input-group label {
            display:block;
            font-size:0.7rem;
            font-weight:600;
            color:var(--text-dim);
            margin-bottom:6px;
            letter-spacing:0.3px;
        }
        .cyber-input {
            width:100%;
            padding:12px 16px;
            background:var(--surface2);
            border:1px solid var(--border);
            border-radius:var(--radius-sm);
            color:var(--text);
            font-size:0.9rem;
            outline:none;
            transition:border .2s;
        }
        .cyber-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(43,122,255,0.2); }
        .input-with-icon {
            position:relative;
        }
        .input-with-icon .cyber-input { padding-right:44px; }
        .input-icon {
            position:absolute;
            right:12px;
            top:50%;
            transform:translateY(-50%);
            color:var(--text-dim);
            cursor:pointer;
            font-size:1rem;
        }
        .btn {
            padding:12px 20px;
            border:none;
            border-radius:var(--radius-sm);
            font-weight:700;
            font-size:0.85rem;
            cursor:pointer;
            transition:all .2s;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:6px;
            width:100%;
            background:var(--accent);
            color:#fff;
        }
        .btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
        .btn-secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
        .btn-danger { background:#dc3545; color:#fff; }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-sm { padding:6px 14px; font-size:0.7rem; width:auto; }
        .btn-xs { padding:4px 10px; font-size:0.6rem; width:auto; border-radius:6px; }
        .divider {
            display:flex;
            align-items:center;
            gap:12px;
            margin:4px 0;
        }
        .divider-line { flex:1; height:1px; background:var(--border); }
        .divider-text { font-size:0.65rem; color:var(--text-dim); font-weight:500; }
        .badge {
            display:inline-block;
            padding:2px 10px;
            border-radius:12px;
            font-size:0.6rem;
            font-weight:700;
            background:rgba(43,122,255,0.12);
            color:var(--accent);
            border:1px solid rgba(43,122,255,0.2);
        }
        .badge-dev {
            background:rgba(43,122,255,0.18);
            border-color:rgba(43,122,255,0.3);
            color:var(--accent);
        }
        .verified-badge {
            display:inline-flex;
            align-items:center;
            justify-content:center;
            width:18px;
            height:18px;
            border-radius:50%;
            background:var(--accent);
            color:#fff;
            font-size:0.5rem;
            font-weight:800;
            box-shadow:0 0 12px rgba(43,122,255,0.5);
            margin-left:4px;
            flex-shrink:0;
        }
        /* ===== MAIN APP ===== */
        .user-info-bar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:10px 16px;
            background:var(--surface2);
            border-bottom:1px solid var(--border);
            flex-shrink:0;
            gap:8px;
        }
        .user-info-left {
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
        }
        .user-avatar {
            width:34px;
            height:34px;
            border-radius:50%;
            background:var(--surface2);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:0.8rem;
            overflow:hidden;
            border:2px solid var(--border);
            flex-shrink:0;
        }
        .user-avatar img { width:100%; height:100%; object-fit:cover; }
        .user-avatar.large { width:64px; height:64px; font-size:1.5rem; }
        .user-name {
            font-weight:600;
            font-size:0.85rem;
        }
        .user-name .rgb-nick {
            display:inline-block;
            background-size:300% 100%;
            -webkit-background-clip:text;
            background-clip:text;
            -webkit-text-fill-color:transparent;
            animation:rgbFlow 2.4s linear infinite;
            font-weight:700;
        }
        @keyframes rgbFlow {
            0%{background-position:0% 50%}
            50%{background-position:100% 50%}
            100%{background-position:0% 50%}
        }
        .user-handle {
            font-size:0.6rem;
            color:var(--text-dim);
        }
        .tab-nav {
            display:flex;
            border-bottom:1px solid var(--border);
            background:var(--surface);
            flex-shrink:0;
            overflow-x:auto;
            scrollbar-width:none;
        }
        .tab-nav::-webkit-scrollbar { display:none; }
        .tab-btn {
            flex:1;
            padding:10px 8px;
            background:transparent;
            border:none;
            color:var(--text-dim);
            font-weight:600;
            font-size:0.6rem;
            text-transform:uppercase;
            letter-spacing:0.5px;
            cursor:pointer;
            transition:all .2s;
            white-space:nowrap;
            border-bottom:2px solid transparent;
        }
        .tab-btn.active {
            color:var(--text);
            border-bottom-color:var(--accent);
        }
        .tab-btn:hover { color:var(--text); background:rgba(255,255,255,0.02); }
        .tab-content { display:none; flex:1; flex-direction:column; overflow:hidden; }
        .tab-content.active { display:flex; }

        /* ===== CHAT SCREEN ===== */
        .chat-header {
            padding:12px 16px;
            border-bottom:1px solid var(--border);
            display:flex;
            align-items:center;
            justify-content:space-between;
            background:var(--surface2);
            flex-shrink:0;
        }
        .chat-user-info {
            display:flex;
            align-items:center;
            gap:10px;
        }
        .chat-user-name {
            font-weight:600;
            font-size:0.9rem;
        }
        .messages-area {
            flex:1;
            overflow-y:auto;
            padding:16px;
            display:flex;
            flex-direction:column;
            gap:6px;
            background:var(--bg);
        }
        .message {
            max-width:85%;
            padding:8px 14px;
            border-radius:14px;
            word-wrap:break-word;
            line-height:1.4;
            font-size:0.9rem;
            position:relative;
        }
        .message-sent {
            align-self:flex-end;
            background:var(--accent);
            color:#fff;
            border-bottom-right-radius:4px;
        }
        .message-received {
            align-self:flex-start;
            background:var(--surface2);
            color:var(--text);
            border-bottom-left-radius:4px;
        }
        .message-wrapper {
            display:flex;
            gap:8px;
            align-items:flex-end;
        }
        .message-wrapper.sent { flex-direction:row-reverse; align-self:flex-end; }
        .message-wrapper.received { align-self:flex-start; }
        .message-avatar {
            width:28px;
            height:28px;
            border-radius:50%;
            flex-shrink:0;
            overflow:hidden;
            background:var(--surface2);
            display:flex;
            align-items:center;
            justify-content:center;
            font-weight:700;
            font-size:0.6rem;
            border:1px solid var(--border);
            cursor:pointer;
        }
        .message-avatar img { width:100%; height:100%; object-fit:cover; }
        .message-sender {
            font-size:0.6rem;
            font-weight:600;
            color:var(--accent);
            margin-bottom:2px;
        }
        .message-sender.dev { color:var(--accent); }
        .message-meta {
            font-size:0.5rem;
            color:var(--text-dim);
            text-align:right;
            margin-top:2px;
        }
        .system-message {
            text-align:center;
            font-size:0.65rem;
            color:var(--text-dim);
            padding:4px 0;
        }
        .input-area {
            padding:10px 14px;
            border-top:1px solid var(--border);
            display:flex;
            gap:8px;
            background:var(--surface);
            align-items:center;
            flex-shrink:0;
        }
        .input-area .cyber-input {
            flex:1;
            padding:10px 14px;
            font-size:0.85rem;
            background:var(--surface2);
        }
        .send-btn {
            width:40px;
            height:40px;
            border-radius:50%;
            background:var(--accent);
            border:none;
            color:#fff;
            font-size:1.1rem;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:all .2s;
            flex-shrink:0;
        }
        .send-btn:hover { filter:brightness(1.1); transform:scale(1.04); }
        /* ===== PROFILE ===== */
        .profile-content {
            padding:20px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:16px;
            align-items:center;
        }
        .profile-card {
            width:100%;
            background:var(--surface2);
            border-radius:var(--radius);
            padding:16px;
            border:1px solid var(--border);
        }
        .profile-row {
            display:flex;
            justify-content:space-between;
            padding:8px 0;
            border-bottom:1px solid rgba(255,255,255,0.04);
        }
        .profile-row:last-child { border-bottom:none; }
        .profile-label { font-size:0.65rem; color:var(--text-dim); }
        .profile-value { font-size:0.8rem; font-weight:500; }
        .gradient-picker {
            display:flex;
            gap:8px;
            align-items:center;
            flex-wrap:wrap;
            margin-top:8px;
        }
        .gradient-picker input[type="color"] {
            width:36px;
            height:36px;
            border:none;
            border-radius:8px;
            background:transparent;
            cursor:pointer;
            padding:0;
        }
        .gradient-preview {
            width:100%;
            height:32px;
            border-radius:8px;
            background:linear-gradient(135deg,#2b7aff,#8b5cf6);
            background-size:300% 300%;
            animation:previewAnim 2s linear infinite;
            margin-top:6px;
        }
        @keyframes previewAnim { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
        /* ===== CONSOLE ===== */
        .console-output {
            flex:1;
            padding:12px;
            font-family:'JetBrains Mono',monospace;
            font-size:0.65rem;
            overflow-y:auto;
            background:var(--bg);
            border:1px solid var(--border);
            border-radius:8px;
            min-height:180px;
            color:var(--text-dim);
            line-height:1.6;
        }
        .console-output .success { color:var(--green); }
        .console-output .error { color:#ff6b6b; }
        .console-output .cmd { color:var(--accent); }
        .console-input-row {
            display:flex;
            gap:6px;
            padding:8px 0;
            border-top:1px solid var(--border);
            background:var(--surface);
            flex-shrink:0;
        }
        .console-input-row .cyber-input {
            flex:1;
            padding:8px 12px;
            font-size:0.65rem;
            font-family:'JetBrains Mono',monospace;
        }
        .console-toolbar {
            display:flex;
            gap:4px;
            flex-wrap:wrap;
            padding:6px 0;
            border-bottom:1px solid var(--border);
        }
        .console-toolbar .btn-xs {
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text-dim);
        }
        .console-toolbar .btn-xs:hover { border-color:var(--accent); color:var(--text); }
        /* ===== MODAL ===== */
        .modal-overlay {
            display:none;
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.8);
            z-index:900;
            justify-content:center;
            align-items:center;
            backdrop-filter:blur(6px);
        }
        .modal-overlay.active { display:flex; }
        .modal-container {
            width:90%;
            max-width:440px;
            max-height:80vh;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius);
            padding:20px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:14px;
        }
        .modal-title {
            font-weight:700;
            font-size:1rem;
            color:var(--text);
            text-align:center;
        }
        .modal-close {
            position:absolute;
            top:12px;
            right:12px;
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text-dim);
            width:30px;
            height:30px;
            border-radius:50%;
            cursor:pointer;
            font-size:0.8rem;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .modal-close:hover { border-color:var(--accent); color:var(--text); }
        .modal-container { position:relative; }
        .commands-grid .cmd-item {
            display:grid;
            grid-template-columns:1fr 1.2fr;
            gap:8px;
            padding:8px 12px;
            border-bottom:1px solid var(--border);
            font-size:0.7rem;
        }
        .commands-grid .cmd-item:last-child { border-bottom:none; }
        .cmd-name { font-family:'JetBrains Mono',monospace; color:var(--accent); }
        .cmd-desc { color:var(--text-dim); text-align:right; }
        /* ===== SEARCH ===== */
        .search-results {
            margin-top:8px;
            display:none;
            background:var(--surface2);
            border-radius:var(--radius-sm);
            border:1px solid var(--border);
            max-height:200px;
            overflow-y:auto;
        }
        .search-result-item {
            padding:10px 14px;
            display:flex;
            align-items:center;
            gap:10px;
            cursor:pointer;
            border-bottom:1px solid var(--border);
        }
        .search-result-item:last-child { border-bottom:none; }
        .search-result-item:hover { background:rgba(43,122,255,0.06); }
        /* ===== TOAST ===== */
        .toast {
            position:fixed;
            top:20px;
            left:50%;
            transform:translateX(-50%);
            padding:10px 24px;
            border-radius:20px;
            font-weight:600;
            font-size:0.75rem;
            z-index:999;
            animation:slideDown 0.3s ease, fadeOut 0.3s ease 2.5s forwards;
            background:var(--surface2);
            border:1px solid var(--border);
            color:var(--text);
        }
        .toast.success { border-color:var(--green); color:var(--green); }
        .toast.error { border-color:#ff6b6b; color:#ff6b6b; }
        @keyframes slideDown { from{transform:translateX(-50%) translateY(-60px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
        @keyframes fadeOut { to{opacity:0;transform:translateX(-50%) translateY(-10px)} }
        /* ===== RESPONSIVE ===== */
        @media (max-width:540px) {
            body { padding:0; }
            .app-container { height:100vh; max-height:none; border-radius:0; border:none; }
        }
        .flex-1 { flex:1; }
        .gap-2 { gap:8px; }
        .mt-2 { margin-top:8px; }
        .text-center { text-align:center; }
        .text-dim { color:var(--text-dim); }
        .text-sm { font-size:0.7rem; }
        .text-xs { font-size:0.6rem; }
        .w-full { width:100%; }
        .hidden { display:none !important; }
        .flex { display:flex; }
        .items-center { align-items:center; }
        .gap-1 { gap:4px; }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- HEADER -->
    <div class="header">
        <div class="header-logo">◆ RunaChat</div>
        <div class="header-actions">
            <div class="server-status">
                <span class="status-dot"></span>
                <span id="serverStatusText">Локальный</span>
            </div>
        </div>
    </div>

    <!-- AUTH SCREEN -->
    <div class="screen active" id="authScreen">
        <div class="form-container">
            <div class="text-center" style="margin-bottom:8px;">
                <div style="font-weight:800;font-size:1.8rem;background:linear-gradient(135deg,#2b7aff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">◆ RunaChat ◆</div>
                <div class="text-sm text-dim">личный мессенджер</div>
            </div>
            <div id="loginForm">
                <div class="cyber-input-group">
                    <label>👤 Логин / @username / телефон</label>
                    <input type="text" class="cyber-input" id="loginIdentifier" placeholder="Введите логин..." maxlength="40" autocomplete="off">
                </div>
                <div class="cyber-input-group">
                    <label>🔑 Пароль</label>
                    <div class="input-with-icon">
                        <input type="password" class="cyber-input" id="loginPassword" placeholder="Введите пароль..." maxlength="30">
                        <span class="input-icon" onclick="togglePass('loginPassword',this)">👁</span>
                    </div>
                </div>
                <button class="btn" onclick="login()">◈ Войти ◈</button>
                <div class="divider"><div class="divider-line"></div><div class="divider-text">или</div><div class="divider-line"></div></div>
                <button class="btn btn-secondary" onclick="showRegister()">📝 Зарегистрироваться</button>
                <button class="btn btn-outline" onclick="showDevLogin()">👑 Вход для разработчика</button>
            </div>
            <div id="registerForm" style="display:none;">
                <div class="text-center"><span class="badge">НОВЫЙ АККАУНТ</span></div>
                <div class="cyber-input-group"><label>👤 Имя пользователя</label><input type="text" class="cyber-input" id="regUsername" placeholder="Ваше имя..." maxlength="20"></div>
                <div class="cyber-input-group"><label>🔖 @username (уникальный)</label><input type="text" class="cyber-input" id="regAtUsername" placeholder="@username..." maxlength="30"></div>
                <div class="cyber-input-group"><label>🔑 Пароль (6+)</label><div class="input-with-icon"><input type="password" class="cyber-input" id="regPassword" placeholder="Минимум 6 символов..." maxlength="30"><span class="input-icon" onclick="togglePass('regPassword',this)">👁</span></div></div>
                <div class="cyber-input-group"><label>🔑 Подтверждение</label><input type="password" class="cyber-input" id="regPasswordConfirm" placeholder="Повторите пароль..." maxlength="30"></div>
                <button class="btn" onclick="register()">◆ Создать аккаунт ◆</button>
                <button class="btn btn-outline" onclick="showLoginForm()">← Назад</button>
            </div>
            <div id="devLoginForm" style="display:none;">
                <div class="text-center"><span class="badge badge-dev">👑 РАЗРАБОТЧИК</span></div>
                <div class="cyber-input-group"><label>👤 Имя разработчика</label><input type="text" class="cyber-input" id="devUsername" placeholder="Имя..." maxlength="20"></div>
                <div class="cyber-input-group"><label>🔑 Ключ</label><div class="input-with-icon"><input type="password" class="cyber-input" id="devPassword" placeholder="Ключ..." maxlength="30"><span class="input-icon" onclick="togglePass('devPassword',this)">👁</span></div></div>
                <button class="btn" onclick="devLogin()">👑 Войти</button>
                <button class="btn btn-outline" onclick="showLoginForm()">← Назад</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="screen" id="mainAppScreen">
        <div class="user-info-bar">
            <div class="user-info-left" onclick="switchTab('profile')">
                <div class="user-avatar" id="userAvatar">?</div>
                <div>
                    <div class="user-name" id="displayUsername">User</div>
                    <div class="user-handle" id="displayUserHandle">@user</div>
                </div>
            </div>
            <button class="btn btn-sm btn-outline" onclick="logout()" style="width:auto;padding:4px 12px;font-size:0.6rem;">🚪 Выйти</button>
        </div>
        <div class="tab-nav" id="tabNav">
            <button class="tab-btn active" onclick="switchTab('chats')">💬 Чаты</button>
            <button class="tab-btn" onclick="switchTab('search')">🔍 Поиск</button>
            <button class="tab-btn" onclick="switchTab('profile')">👤 Профиль</button>
            <button class="tab-btn" id="consoleTabBtn" onclick="switchTab('console')" style="display:none;">🖥 Консоль</button>
        </div>

        <!-- CHATS TAB -->
        <div class="tab-content active" id="tabChats">
            <div style="padding:16px;flex:1;overflow-y:auto;">
                <div style="font-size:0.7rem;color:var(--text-dim);margin-bottom:12px;">✉️ Личные сообщения</div>
                <div id="chatList" style="display:flex;flex-direction:column;gap:6px;">
                    <div class="text-dim text-sm" style="padding:16px 0;text-align:center;">Нет активных чатов</div>
                </div>
                <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:12px;">
                    <div class="cyber-input-group"><label>👤 Начать чат с @username</label>
                        <div style="display:flex;gap:6px;">
                            <input type="text" class="cyber-input" id="newChatInput" placeholder="@username..." style="flex:1;">
                            <button class="btn btn-sm" onclick="startChat()" style="width:auto;padding:0 16px;">▶</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SEARCH TAB -->
        <div class="tab-content" id="tabSearch">
            <div style="padding:16px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;">
                <div class="cyber-input-group"><label>🔍 Поиск пользователей</label><input type="text" class="cyber-input" id="searchInput" placeholder="@username или имя..." oninput="handleSearch()"></div>
                <div class="search-results" id="searchResults"></div>
            </div>
        </div>

        <!-- PROFILE TAB -->
        <div class="tab-content" id="tabProfile">
            <div class="profile-content" id="profileContent"></div>
        </div>

        <!-- CONSOLE TAB -->
        <div class="tab-content" id="tabConsole">
            <div style="padding:12px;flex:1;display:flex;flex-direction:column;overflow:hidden;">
                <div id="consoleLogin" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
                    <p class="text-dim text-sm">Введите код доступа</p>
                    <input type="password" class="cyber-input" id="consoleCode" placeholder="····" maxlength="10" style="max-width:200px;text-align:center;font-size:1.1rem;letter-spacing:4px;" onkeypress="if(event.key==='Enter')unlockConsole()">
                    <button class="btn" onclick="unlockConsole()" style="max-width:200px;">🔓 Разблокировать</button>
                </div>
                <div id="consoleUI" style="display:none;flex:1;flex-direction:column;overflow:hidden;">
                    <div class="console-toolbar">
                        <button class="btn btn-xs" onclick="consoleCmd('users')">👥</button>
                        <button class="btn btn-xs" onclick="consoleCmd('bans')">🚫</button>
                        <button class="btn btn-xs" onclick="consoleCmd('usernames')">🔖</button>
                        <button class="btn btn-xs" onclick="consoleCmd('phones')">📱</button>
                        <button class="btn btn-xs" onclick="consoleCmd('say')">💬</button>
                        <button class="btn btn-xs" onclick="openCommandsModal()">📋</button>
                        <button class="btn btn-xs" onclick="lockConsole()">🔒</button>
                    </div>
                    <div class="console-output" id="consoleOutput">🖥 Консоль готова. Введите help</div>
                    <div class="console-input-row">
                        <span style="color:var(--accent);font-weight:700;">➤</span>
                        <input type="text" class="cyber-input" id="consoleCmdInput" placeholder="Команда..." style="font-size:0.65rem;padding:6px 10px;" onkeypress="if(event.key==='Enter')executeConsole()">
                        <button class="btn btn-sm" onclick="executeConsole()" style="width:auto;padding:0 14px;">Run</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- CHAT VIEW (overlay) -->
        <div class="screen" id="chatScreen">
            <div class="chat-header">
                <div class="chat-user-info">
                    <div class="user-avatar" id="chatAvatar">?</div>
                    <div>
                        <div class="chat-user-name" id="chatPartnerName">User</div>
                        <div class="text-xs text-dim" id="chatPartnerHandle">@user</div>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline" onclick="closeChat()" style="width:auto;padding:4px 12px;">✕</button>
            </div>
            <div class="messages-area" id="messagesArea"></div>
            <div class="input-area">
                <input type="text" class="cyber-input" id="messageInput" placeholder="Сообщение..." maxlength="500" onkeypress="if(event.key==='Enter'&&!event.shiftKey)sendMessage()">
                <button class="send-btn" onclick="sendMessage()">▶</button>
            </div>
        </div>
    </div>
</div>

<!-- COMMANDS MODAL -->
<div class="modal-overlay" id="commandsModal" onclick="if(event.target===this)closeCommandsModal()">
    <div class="modal-container">
        <button class="modal-close" onclick="closeCommandsModal()">✕</button>
        <div class="modal-title">📋 Команды консоли</div>
        <div class="commands-grid" id="commandsGrid"></div>
    </div>

<input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handleAvatarUpload(event)">

<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
    // ============================================================
    // DATA LAYER (local + Firebase)
    // ============================================================
    const DB = { users:{}, messages:{}, avatars:{}, nicknames:{}, rgbColors:{}, bans:{}, activities:{}, chats:{} };
    let currentUser = '', currentChat = '', isDev = false, consoleUnlocked = false;
    let firebaseDb = null, firebaseReady = false;
    let onlineUsers = {};

    function loadData(k) { return DB[k] || {}; }
    function saveData(k, v) { DB[k] = v; if (firebaseReady && firebaseDb) firebaseDb.ref('runachat/'+k).set(v).catch(()=>{}); }

    function getUsers() { return loadData('users'); }
    function saveUsers(u) { saveData('users', u); }
    function getMessages() { return loadData('messages'); }
    function saveMessages(m) { saveData('messages', m); }
    function getAvatars() { return loadData('avatars'); }
    function saveAvatars(a) { saveData('avatars', a); }
    function getNicknames() { return loadData('nicknames'); }
    function saveNicknames(n) { saveData('nicknames', n); }
    function getRgbColors() { return loadData('rgbColors'); }
    function saveRgbColors(r) { saveData('rgbColors', r); }
    function getBans() { return loadData('bans'); }
    function saveBans(b) { saveData('bans', b); }
    function getActivities() { return loadData('activities'); }
    function saveActivities(a) { saveData('activities', a); }
    function getChats() { return loadData('chats'); }
    function saveChats(c) { saveData('chats', c); }

    // ============================================================
    // HELPERS
    // ============================================================
    const DEV_NAME = 'Bot', DEV_PASS = 'vzlom', CONSOLE_CODE = 'VGX233';
    const CONSOLE_CMDS = [
        {category:'📊 Информация', cmds:[{cmd:'help',desc:'Все команды'},{cmd:'users',desc:'Список пользователей'},{cmd:'user <name>',desc:'Детали'},{cmd:'bans',desc:'Баны'},{cmd:'usernames',desc:'@username'},{cmd:'phones',desc:'Телефоны'},{cmd:'online',desc:'Онлайн'}]},
        {category:'💬 Сообщения', cmds:[{cmd:'say <текст>',desc:'Отправить в общий чат'}]},
        {category:'🛡 Модерация', cmds:[{cmd:'ban <user> <mins> <reason>',desc:'Бан'},{cmd:'unban <user>',desc:'Разбан'}]},
        {category:'📱 Телефоны', cmds:[{cmd:'setphone <user> <phone>',desc:'Назначить'},{cmd:'nophone <user>',desc:'Удалить'}]},
        {category:'🔖 @username', cmds:[{cmd:'setusername <user> <@name>',desc:'Назначить'},{cmd:'nousername <user>',desc:'Удалить'}]},
        {category:'👤 Профиль', cmds:[{cmd:'setnick <user> <nick>',desc:'Сменить ник'},{cmd:'rgb <user> <#c1> <#c2> <#c3>',desc:'Градиент ника'},{cmd:'setavatar <user> <url>',desc:'Аватар'}]},
        {category:'⚙ Управление', cmds:[{cmd:'/dev <user>',desc:'Назначить разработчика'},{cmd:'/undev <user>',desc:'Снять разработчика'},{cmd:'deleteuser <user>',desc:'Удалить'},{cmd:'clear',desc:'Очистить вывод'},{cmd:'lock',desc:'Заблокировать'}]}
    ];

    function escapeHtml(t) { const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }
    function showToast(msg, type='info') { const old=document.querySelector('.toast'); if(old)old.remove(); const d=document.createElement('div'); d.className='toast '+type; d.textContent=msg; document.body.appendChild(d); setTimeout(()=>d.remove(),3000); }
    function togglePass(id,el) { const i=document.getElementById(id); if(i.type==='password'){i.type='text';el.textContent='🙈';}else{i.type='password';el.textContent='👁';} }
    function getDisplayName(u) { const n=getNicknames(); return (n[u?.toLowerCase()] || u || '?'); }
    function getRgb(u) { const r=getRgbColors(); return r[u?.toLowerCase()] || null; }
    function getUserAvatar(u) { const a=getAvatars(); return a[u?.toLowerCase()] || null; }
    function isUserOnline(u) { return !!onlineUsers[u?.toLowerCase()]; }

    function getDisplayNameHTML(u) {
        const name = escapeHtml(getDisplayName(u));
        const rgb = getRgb(u);
        if (!rgb) return name;
        return `<span class="rgb-nick" style="background-image:linear-gradient(90deg,${rgb[0]},${rgb[1]},${rgb[2]});">${name}</span>`;
    }

    function getAvatarHTML(u, size='') {
        const url = getUserAvatar(u);
        if (url) return `<div class="message-avatar ${size}" style="background-image:url('${url}');background-size:cover;" onclick="openProfile('${u}')"></div>`;
        return `<div class="message-avatar ${size}" onclick="openProfile('${u}')">${u?.charAt(0).toUpperCase()||'?'}</div>`;
    }

    function getFullUserHandle(u) {
        const users=getUsers();
        const data=users[u?.toLowerCase()];
        if(data && data.at_username) return data.at_username;
        return '@'+u;
    }

    // ============================================================
    // AUTH
    // ============================================================
    function login() {
        const id = document.getElementById('loginIdentifier').value.trim();
        const p = document.getElementById('loginPassword').value;
        if(!id||!p) return showToast('Заполните все поля','error');
        const users=getUsers();
        let found=null;
        const il=id.toLowerCase();
        if(users[il]) found=users[il];
        else for(const k in users) {
            const u=users[k];
            if(u.username.toLowerCase()===il || (u.at_username && u.at_username.toLowerCase()===il) || (u.phone && u.phone===id)) { found=u; break; }
        }
        if(found && found.password===p) {
            currentUser=found.username;
            isDev=found.role==='dev';
            onlineUsers[currentUser.toLowerCase()]=Date.now();
            showToast('Добро пожаловать!','success');
            enterApp();
        } else showToast('Неверные данные','error');
    }

    function register() {
        const u=document.getElementById('regUsername').value.trim();
        const at=document.getElementById('regAtUsername').value.trim();
        const p=document.getElementById('regPassword').value;
        const pc=document.getElementById('regPasswordConfirm').value;
        if(!u||u.length<3) return showToast('Имя минимум 3 символа','error');
        if(!at || !at.startsWith('@') || at.length<3) return showToast('Введите @username (начинается с @)','error');
        if(!p||p.length<6) return showToast('Пароль минимум 6 символов','error');
        if(p!==pc) return showToast('Пароли не совпадают','error');
        const users=getUsers();
        const uk=u.toLowerCase();
        const atk=at.toLowerCase();
        if(users[uk]) return showToast('Имя занято','error');
        for(const k in users) if(users[k].at_username && users[k].at_username.toLowerCase()===atk) return showToast('@username занят','error');
        users[uk]={username:u,password:p,role:'user',created:Date.now(),total_messages:0,at_username:at,phone:null};
        saveUsers(users);
        showToast('Аккаунт создан!','success');
        document.getElementById('loginIdentifier').value=u;
        showLoginForm();
    }

    function devLogin() {
        const u=document.getElementById('devUsername').value.trim();
        const p=document.getElementById('devPassword').value;
        if(!u||!p) return showToast('Заполните поля','error');
        if(u.toLowerCase()===DEV_NAME.toLowerCase() && p===DEV_PASS) {
            const users=getUsers();
            const dk=DEV_NAME.toLowerCase();
            if(!users[dk]) { users[dk]={username:DEV_NAME,password:DEV_PASS,role:'dev',created:Date.now(),total_messages:0,at_username:'@bot',phone:'+88800011'}; saveUsers(users); }
            currentUser=DEV_NAME; isDev=true;
            onlineUsers[currentUser.toLowerCase()]=Date.now();
            showToast('Добро пожаловать, разработчик!','success');
            enterApp();
        } else showToast('Неверные данные','error');
    }

    function logout() {
        currentUser=''; currentChat=''; isDev=false; consoleUnlocked=false;
        document.getElementById('mainAppScreen').classList.remove('active');
        document.getElementById('mainAppScreen').style.display='none';
        document.getElementById('authScreen').classList.add('active');
        document.getElementById('authScreen').style.display='flex';
        document.getElementById('chatScreen').style.display='none';
        document.getElementById('tabNav').style.display='flex';
        document.getElementById('consoleTabBtn').style.display='none';
        showToast('Вы вышли','info');
    }

    function showLoginForm() {
        document.getElementById('loginForm').style.display='block';
        document.getElementById('registerForm').style.display='none';
        document.getElementById('devLoginForm').style.display='none';
    }
    function showRegister() {
        document.getElementById('loginForm').style.display='none';
        document.getElementById('registerForm').style.display='block';
        document.getElementById('devLoginForm').style.display='none';
    }
    function showDevLogin() {
        document.getElementById('loginForm').style.display='none';
        document.getElementById('registerForm').style.display='none';
        document.getElementById('devLoginForm').style.display='block';
    }

    // ============================================================
    // MAIN APP
    // ============================================================
    function enterApp() {
        document.getElementById('authScreen').classList.remove('active');
        document.getElementById('authScreen').style.display='none';
        document.getElementById('mainAppScreen').classList.add('active');
        document.getElementById('mainAppScreen').style.display='flex';
        updateUI();
        if(isDev) document.getElementById('consoleTabBtn').style.display='inline-block';
        switchTab('chats');
        renderChatList();
        // load gradient settings from profile
    }

    function updateUI() {
        const av=document.getElementById('userAvatar');
        const url=getUserAvatar(currentUser);
        if(url) { av.innerHTML=`<img src="${url}">`; } else { av.innerHTML=currentUser?.charAt(0).toUpperCase()||'?'; }
        document.getElementById('displayUsername').innerHTML = getDisplayNameHTML(currentUser);
        document.getElementById('displayUserHandle').textContent = getFullUserHandle(currentUser);
        if(isDev) {
            document.getElementById('displayUsername').innerHTML += `<span class="verified-badge">✓</span>`;
        }
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll('#tabNav .tab-btn').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('#mainAppScreen .tab-content').forEach(c=>c.classList.remove('active'));
        const map={chats:0,search:1,profile:2,console:3};
        if(map[tab]!==undefined) document.querySelectorAll('#tabNav .tab-btn')[map[tab]]?.classList.add('active');
        if(tab==='chats') { document.getElementById('tabChats').classList.add('active'); renderChatList(); }
        else if(tab==='search') { document.getElementById('tabSearch').classList.add('active'); }
        else if(tab==='profile') { document.getElementById('tabProfile').classList.add('active'); renderProfile(); }
        else if(tab==='console') { document.getElementById('tabConsole').classList.add('active'); if(consoleUnlocked) document.getElementById('consoleUI').style.display='flex'; }
        document.getElementById('chatScreen').style.display='none';
        document.getElementById('tabNav').style.display='flex';
    }

    function openChat(partner) {
        if(!partner) return;
        currentChat=partner;
        document.getElementById('tabNav').style.display='none';
        document.querySelectorAll('#mainAppScreen .tab-content').forEach(c=>c.classList.remove('active'));
        document.getElementById('chatScreen').style.display='flex';
        document.getElementById('chatPartnerName').textContent=getDisplayName(partner);
        document.getElementById('chatPartnerHandle').textContent=getFullUserHandle(partner);
        const av=document.getElementById('chatAvatar');
        const url=getUserAvatar(partner);
        if(url) { av.innerHTML=`<img src="${url}">`; } else { av.innerHTML=partner?.charAt(0).toUpperCase()||'?'; }
        renderMessages();
        document.getElementById('messageInput').focus();
    }

    function closeChat() {
        currentChat='';
        document.getElementById('chatScreen').style.display='none';
        document.getElementById('tabNav').style.display='flex';
        switchTab('chats');
    }

    // ============================================================
    // CHAT LIST
    // ============================================================
    function renderChatList() {
        const container=document.getElementById('chatList');
        const chats=getChats();
        const myChats=chats[currentUser?.toLowerCase()] || {};
        const keys=Object.keys(myChats);
        if(keys.length===0) {
            container.innerHTML='<div class="text-dim text-sm" style="padding:16px 0;text-align:center;">Нет чатов. Начните диалог!</div>';
            return;
        }
        container.innerHTML=keys.map(partner=>{
            const lastMsg=myChats[partner]?.slice(-1)[0];
            const preview=lastMsg ? (lastMsg.text?.slice(0,40)||'') : '';
            return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);" onclick="openChat('${partner}')">
                ${getAvatarHTML(partner)}
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:600;font-size:0.8rem;">${getDisplayNameHTML(partner)}</div>
                    <div style="font-size:0.6rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${preview||'Начать диалог'}</div>
                </div>
                <div style="font-size:0.5rem;color:var(--text-dim);">${lastMsg ? new Date(lastMsg.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}) : ''}</div>
            </div>`;
        }).join('');
    }

    function startChat() {
        const input=document.getElementById('newChatInput');
        const val=input.value.trim();
        if(!val) return showToast('Введите @username','error');
        const users=getUsers();
        let target=null;
        const v=val.toLowerCase();
        for(const k in users) {
            const u=users[k];
            if(u.at_username && u.at_username.toLowerCase()===v) { target=u.username; break; }
            if(u.username.toLowerCase()===v) { target=u.username; break; }
        }
        if(!target || target===currentUser) return showToast('Пользователь не найден','error');
        // create chat
        const chats=getChats();
        const myKey=currentUser.toLowerCase();
        if(!chats[myKey]) chats[myKey]={};
        if(!chats[myKey][target]) chats[myKey][target]=[];
        // also create for partner
        const pk=target.toLowerCase();
        if(!chats[pk]) chats[pk]={};
        if(!chats[pk][currentUser]) chats[pk][currentUser]=[];
        saveChats(chats);
        input.value='';
        renderChatList();
        openChat(target);
        showToast('Чат создан','success');
    }

    // ============================================================
    // MESSAGES
    // ============================================================
    function sendMessage() {
        const input=document.getElementById('messageInput');
        const text=input.value.trim();
        if(!text || !currentChat || !currentUser) return;
        const chats=getChats();
        const myKey=currentUser.toLowerCase();
        const pk=currentChat.toLowerCase();
        if(!chats[myKey]) chats[myKey]={};
        if(!chats[myKey][currentChat]) chats[myKey][currentChat]=[];
        if(!chats[pk]) chats[pk]={};
        if(!chats[pk][currentUser]) chats[pk][currentUser]=[];
        const msg={sender:currentUser,text,time:Date.now(),is_dev:isDev};
        chats[myKey][currentChat].push(msg);
        chats[pk][currentUser].push(msg);
        saveChats(chats);
        input.value='';
        renderMessages();
        renderChatList();
        // update online
        onlineUsers[currentUser.toLowerCase()]=Date.now();
    }

    function renderMessages() {
        const area=document.getElementById('messagesArea');
        if(!currentChat) return;
        const chats=getChats();
        const myKey=currentUser.toLowerCase();
        const msgs=chats[myKey]?.[currentChat] || [];
        area.innerHTML='';
        if(msgs.length===0) { area.innerHTML='<div class="system-message">Начните общение</div>'; return; }
        msgs.forEach(m=>{
            const isMine = m.sender===currentUser;
            const w=document.createElement('div');
            w.className=`message-wrapper ${isMine?'sent':'received'}`;
            if(!isMine) {
                const av=document.createElement('div');
                av.className='message-avatar';
                const url=getUserAvatar(m.sender);
                if(url) { av.innerHTML=`<img src="${url}">`; } else { av.textContent=m.sender?.charAt(0).toUpperCase()||'?'; }
                av.onclick=()=>openProfile(m.sender);
                w.appendChild(av);
            }
            const d=document.createElement('div');
            d.className=`message ${isMine?'message-sent':'message-received'}`;
            const senderDiv=document.createElement('div');
            senderDiv.className=`message-sender ${m.is_dev?'dev':''}`;
            senderDiv.innerHTML = isMine ? '' : getDisplayNameHTML(m.sender);
            d.appendChild(senderDiv);
            const textDiv=document.createElement('div');
            // apply rgb to own text if dev and gradient set
            let txt=m.text;
            if(isMine && isDev) {
                const rgb=getRgb(currentUser);
                if(rgb) {
                    textDiv.style.backgroundImage=`linear-gradient(90deg,${rgb[0]},${rgb[1]},${rgb[2]})`;
                    textDiv.style.backgroundSize='300% 100%';
                    textDiv.style.animation='rgbFlow 2.4s linear infinite';
                    textDiv.style.webkitBackgroundClip='text';
                    textDiv.style.backgroundClip='text';
                    textDiv.style.webkitTextFillColor='transparent';
                    textDiv.style.fontWeight='700';
                }
            }
            textDiv.textContent=txt;
            d.appendChild(textDiv);
            const meta=document.createElement('div');
            meta.className='message-meta';
            meta.textContent=new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
            d.appendChild(meta);
            w.appendChild(d);
            area.appendChild(w);
        });
        area.scrollTop=area.scrollHeight;
    }

    // ============================================================
    // PROFILE
    // ============================================================
    function renderProfile() {
        const container=document.getElementById('profileContent');
        const rgb=getRgb(currentUser) || ['#2b7aff','#8b5cf6','#2b7aff'];
        container.innerHTML=`
            <div style="text-align:center;">
                <div class="user-avatar large" style="margin:0 auto;cursor:pointer;" onclick="document.getElementById('avatarFileInput').click()">
                    ${getUserAvatar(currentUser) ? `<img src="${getUserAvatar(currentUser)}">` : currentUser?.charAt(0).toUpperCase()||'?'}
                </div>
                <div style="font-weight:700;font-size:1.2rem;margin-top:6px;">${getDisplayNameHTML(currentUser)}</div>
                <div class="text-sm text-dim">${getFullUserHandle(currentUser)}</div>
                ${isDev ? `<span class="verified-badge" style="display:inline-block;margin-top:4px;">✓</span>` : ''}
            </div>
            <div class="profile-card">
                <div class="profile-row"><span class="profile-label">Имя</span><span class="profile-value">${escapeHtml(getDisplayName(currentUser))}</span></div>
                <div class="profile-row"><span class="profile-label">@username</span><span class="profile-value">${getFullUserHandle(currentUser)}</span></div>
                <div class="profile-row"><span class="profile-label">Телефон</span><span class="profile-value">${getUsers()[currentUser?.toLowerCase()]?.phone || '—'}</span></div>
                <div class="profile-row"><span class="profile-label">Роль</span><span class="profile-value">${isDev ? '👑 Разработчик' : '👤 Пользователь'}</span></div>
                <div class="profile-row"><span class="profile-label">Сообщений</span><span class="profile-value">${getUsers()[currentUser?.toLowerCase()]?.total_messages||0}</span></div>
            </div>
            <div class="profile-card">
                <div class="text-sm" style="font-weight:600;margin-bottom:4px;">🎨 Градиент ника</div>
                <div class="gradient-picker">
                    <input type="color" id="rgb1" value="${rgb[0]}" onchange="updateGradientPreview()">
                    <input type="color" id="rgb2" value="${rgb[1]}" onchange="updateGradientPreview()">
                    <input type="color" id="rgb3" value="${rgb[2]}" onchange="updateGradientPreview()">
                    <button class="btn btn-sm" onclick="saveGradient()" style="width:auto;padding:4px 16px;">💾 Сохранить</button>
                </div>
                <div class="gradient-preview" id="gradientPreview" style="background:linear-gradient(90deg,${rgb[0]},${rgb[1]},${rgb[2]});"></div>
                <div class="text-xs text-dim" style="margin-top:4px;">Нажмите на аватар, чтобы загрузить новое фото</div>
            </div>
            <div class="profile-card">
                <div class="text-sm" style="font-weight:600;margin-bottom:4px;">📜 Активность</div>
                <div style="max-height:120px;overflow-y:auto;">
                    ${(getActivities()[currentUser?.toLowerCase()] || []).slice(-5).reverse().map(a=>`<div class="text-xs text-dim" style="padding:2px 0;border-bottom:1px solid var(--border);">${new Date(a.time).toLocaleString()} — ${a.action}</div>`).join('') || 'Нет активности'}
                </div>
            </div>
        `;
        // sync gradient preview
        document.getElementById('rgb1').value=rgb[0];
        document.getElementById('rgb2').value=rgb[1];
        document.getElementById('rgb3').value=rgb[2];
        updateGradientPreview();
    }

    function updateGradientPreview() {
        const c1=document.getElementById('rgb1').value;
        const c2=document.getElementById('rgb2').value;
        const c3=document.getElementById('rgb3').value;
        const preview=document.getElementById('gradientPreview');
        if(preview) preview.style.background=`linear-gradient(90deg,${c1},${c2},${c3})`;
    }

    function saveGradient() {
        const c1=document.getElementById('rgb1').value;
        const c2=document.getElementById('rgb2').value;
        const c3=document.getElementById('rgb3').value;
        const rgb=getRgbColors();
        rgb[currentUser.toLowerCase()]=[c1,c2,c3];
        saveRgbColors(rgb);
        updateUI();
        renderProfile();
        showToast('Градиент сохранён!','success');
    }

    function handleAvatarUpload(e) {
        const file=e.target.files[0];
        if(!file) return;
        if(!file.type.startsWith('image/')) return showToast('Только изображения','error');
        if(file.size>500*1024) return showToast('Макс 500KB','error');
        const reader=new FileReader();
        reader.onload=function(ev) {
            const avatars=getAvatars();
            avatars[currentUser.toLowerCase()]=ev.target.result;
            saveAvatars(avatars);
            updateUI();
            renderProfile();
            showToast('Аватар обновлён!','success');
        };
        reader.readAsDataURL(file);
        e.target.value='';
    }

    function openProfile(username) {
        if(username===currentUser) { switchTab('profile'); return; }
        const users=getUsers();
        const u=users[username?.toLowerCase()];
        if(!u) return showToast('Пользователь не найден','error');
        const rgb=getRgb(username) || ['#2b7aff','#8b5cf6','#2b7aff'];
        const modal=document.createElement('div');
        modal.className='modal-overlay active';
        modal.onclick=(e)=>{ if(e.target===modal) modal.remove(); };
        modal.innerHTML=`
            <div class="modal-container" style="max-width:380px;">
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
                <div style="text-align:center;">
                    <div class="user-avatar large" style="margin:0 auto;">${getUserAvatar(username) ? `<img src="${getUserAvatar(username)}">` : username?.charAt(0).toUpperCase()||'?'}</div>
                    <div style="font-weight:700;font-size:1.1rem;margin-top:6px;">${getDisplayNameHTML(username)}</div>
                    <div class="text-sm text-dim">${getFullUserHandle(username)}</div>
                    ${u.role==='dev' ? `<span class="verified-badge" style="display:inline-block;margin-top:4px;">✓</span>` : ''}
                </div>
                <div class="profile-card">
                    <div class="profile-row"><span class="profile-label">Имя</span><span class="profile-value">${escapeHtml(getDisplayName(username))}</span></div>
                    <div class="profile-row"><span class="profile-label">@username</span><span class="profile-value">${getFullUserHandle(username)}</span></div>
                    <div class="profile-row"><span class="profile-label">Телефон</span><span class="profile-value">${u.phone||'—'}</span></div>
                    <div class="profile-row"><span class="profile-label">Роль</span><span class="profile-value">${u.role==='dev' ? '👑 Разработчик' : '👤 Пользователь'}</span></div>
                    <div class="profile-row"><span class="profile-label">Сообщений</span><span class="profile-value">${u.total_messages||0}</span></div>
                </div>
                <button class="btn" onclick="this.closest('.modal-overlay').remove();startChatWith('${username}')">💬 Написать</button>
            </div>
        `;
        document.body.appendChild(modal);
    }

    function startChatWith(username) {
        const chats=getChats();
        const myKey=currentUser.toLowerCase();
        const pk=username.toLowerCase();
        if(!chats[myKey]) chats[myKey]={};
        if(!chats[myKey][username]) chats[myKey][username]=[];
        if(!chats[pk]) chats[pk]={};
        if(!chats[pk][currentUser]) chats[pk][currentUser]=[];
        saveChats(chats);
        renderChatList();
        openChat(username);
    }

    // ============================================================
    // SEARCH
    // ============================================================
    function handleSearch() {
        const q=document.getElementById('searchInput').value.toLowerCase().trim();
        const res=document.getElementById('searchResults');
        if(!q || q.length<1) { res.style.display='none'; res.innerHTML=''; return; }
        const users=getUsers();
        const found=[];
        for(const k in users) {
            const u=users[k];
            if(u.username.toLowerCase()===currentUser.toLowerCase()) continue;
            if(u.username.toLowerCase().includes(q) || (u.at_username && u.at_username.toLowerCase().includes(q)) || (u.phone && u.phone.includes(q))) {
                found.push(u);
            }
        }
        if(found.length===0) { res.innerHTML='<div style="padding:12px;color:var(--text-dim);text-align:center;">Не найдено</div>'; res.style.display='block'; return; }
        res.innerHTML=found.map(u=>`
            <div class="search-result-item" onclick="openProfile('${u.username}')">
                ${getAvatarHTML(u.username)}
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:0.8rem;">${getDisplayNameHTML(u.username)}</div>
                    <div class="text-xs text-dim">${u.at_username||u.username}</div>
                </div>
                <span class="text-xs" style="color:${isUserOnline(u.username)?'var(--green)':'var(--text-dim)'};">${isUserOnline(u.username)?'🟢 Онлайн':'○ Офлайн'}</span>
            </div>
        `).join('');
        res.style.display='block';
    }

    // ============================================================
    // CONSOLE
    // ============================================================
    function unlockConsole() {
        if(!isDev) return showToast('Только для разработчика','error');
        const code=document.getElementById('consoleCode').value.trim();
        if(code===CONSOLE_CODE) {
            consoleUnlocked=true;
            document.getElementById('consoleLogin').style.display='none';
            document.getElementById('consoleUI').style.display='flex';
            consoleLog('success','✅ Консоль разблокирована');
        } else showToast('Неверный код','error');
    }
    function lockConsole() {
        consoleUnlocked=false;
        document.getElementById('consoleUI').style.display='none';
        document.getElementById('consoleLogin').style.display='flex';
        document.getElementById('consoleOutput').innerHTML='';
        consoleLog('info','🔒 Консоль заблокирована');
    }
    function consoleLog(type,msg) {
        const out=document.getElementById('consoleOutput');
        if(!out) return;
        const d=document.createElement('div');
        d.className=type;
        d.textContent=msg;
        out.appendChild(d);
        out.scrollTop=out.scrollHeight;
    }
    function consoleCmd(cmd) {
        document.getElementById('consoleCmdInput').value=cmd;
        executeConsole();
    }
    function executeConsole() {
        if(!consoleUnlocked || !isDev) return;
        const input=document.getElementById('consoleCmdInput');
        const cmd=input.value.trim();
        if(!cmd) return;
        consoleLog('cmd','➤ '+cmd);
        input.value='';
        const parts=cmd.split(' ');
        const a=parts[0].toLowerCase();
        const users=getUsers();
        const bans=getBans();
        const rgb=getRgbColors();
        const avatars=getAvatars();
        const nicknames=getNicknames();

        switch(a) {
            case 'help': openCommandsModal(); break;
            case 'users': for(const k in users) { const u=users[k]; consoleLog('info',`${isUserOnline(u.username)?'🟢':'○'} ${u.username} ${u.at_username||''} | Msgs:${u.total_messages||0}`); } break;
            case 'user': if(!parts[1]) return consoleLog('error','user <name>'); const u1=users[parts[1].toLowerCase()]; if(!u1) return consoleLog('error','Не найден'); consoleLog('info',`${u1.username} | @${u1.at_username||'—'} | ${u1.phone||'—'} | Msgs:${u1.total_messages||0}`); break;
            case 'bans': for(const k in bans) consoleLog('warn',`🚫 ${k} | ${bans[k].reason||'причина'} | ${bans[k].until===0?'навсегда':new Date(bans[k].until).toLocaleString()}`); break;
            case 'usernames': for(const k in users) if(users[k].at_username) consoleLog('info',`${users[k].at_username} → ${users[k].username}`); break;
            case 'phones': for(const k in users) if(users[k].phone) consoleLog('info',`${users[k].phone} → ${users[k].username}`); break;
            case 'online': for(const k in users) if(isUserOnline(users[k].username)) consoleLog('info',`🟢 ${users[k].username}`); break;
            case 'say': if(parts.length<2) return consoleLog('error','say <текст>'); const txt=parts.slice(1).join(' '); consoleLog('info','📨 Отправлено: '+txt); break;
            case 'ban': if(!parts[1]||!parts[2]) return consoleLog('error','ban <user> <mins> <reason>'); const mins=parseInt(parts[2]); if(isNaN(mins)) return consoleLog('error','минуты числом'); bans[parts[1].toLowerCase()]={reason:parts.slice(3).join(' ')||'причина',until:mins===0?0:Date.now()+mins*60000,by:currentUser}; saveBans(bans); consoleLog('warn',`🚫 ${parts[1]} забанен`); break;
            case 'unban': if(!parts[1]) return consoleLog('error','unban <user>'); delete bans[parts[1].toLowerCase()]; saveBans(bans); consoleLog('success',`✅ ${parts[1]} разбанен`); break;
            case 'setphone': if(!parts[1]||!parts[2]) return consoleLog('error','setphone <user> <phone>'); if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].phone=parts[2]; saveUsers(users); consoleLog('success','📱 Телефон установлен'); } else consoleLog('error','Не найден'); break;
            case 'nophone': if(!parts[1]) return consoleLog('error','nophone <user>'); if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].phone=null; saveUsers(users); consoleLog('success','📱 Телефон удалён'); } else consoleLog('error','Не найден'); break;
            case 'setusername': if(!parts[1]||!parts[2]) return consoleLog('error','setusername <user> <@name>'); const at=parts[2].startsWith('@')?parts[2]:'@'+parts[2]; if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].at_username=at; saveUsers(users); consoleLog('success','🔖 @username установлен'); } else consoleLog('error','Не найден'); break;
            case 'nousername': if(!parts[1]) return consoleLog('error','nousername <user>'); if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].at_username=null; saveUsers(users); consoleLog('success','🔖 @username удалён'); } else consoleLog('error','Не найден'); break;
            case 'setnick': if(!parts[1]||!parts[2]) return consoleLog('error','setnick <user> <nick>'); nicknames[parts[1].toLowerCase()]=parts.slice(2).join(' '); saveNicknames(nicknames); consoleLog('success','👤 Ник изменён'); break;
            case 'rgb': if(!parts[1]||!parts[2]||!parts[3]||!parts[4]) return consoleLog('error','rgb <user> <#c1> <#c2> <#c3>'); rgb[parts[1].toLowerCase()]=[parts[2],parts[3],parts[4]]; saveRgbColors(rgb); consoleLog('success','🌈 Градиент установлен'); break;
            case 'setavatar': if(!parts[1]||!parts[2]) return consoleLog('error','setavatar <user> <url>'); avatars[parts[1].toLowerCase()]=parts[2]; saveAvatars(avatars); consoleLog('success','🖼 Аватар установлен'); break;
            case '/dev': if(!parts[1]) return consoleLog('error','/dev <user>'); if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].role='dev'; saveUsers(users); consoleLog('success','👑 Назначен разработчиком'); } else consoleLog('error','Не найден'); break;
            case '/undev': if(!parts[1]) return consoleLog('error','/undev <user>'); if(users[parts[1].toLowerCase()]) { users[parts[1].toLowerCase()].role='user'; saveUsers(users); consoleLog('success','✅ Права сняты'); } else consoleLog('error','Не найден'); break;
            case 'deleteuser': if(!parts[1]) return consoleLog('error','deleteuser <user>'); if(parts[1].toLowerCase()===DEV_NAME.toLowerCase()) return consoleLog('error','Нельзя удалить основного разработчика'); delete users[parts[1].toLowerCase()]; saveUsers(users); consoleLog('warn','🗑 Пользователь удалён'); break;
            case 'clear': document.getElementById('consoleOutput').innerHTML=''; break;
            case 'lock': lockConsole(); break;
            default: consoleLog('error','Неизвестная команда. Введите help'); break;
        }
        // update UI if needed
        if(['setnick','rgb','setavatar','setusername','/dev','/undev'].includes(a)) { updateUI(); if(currentTab==='profile') renderProfile(); renderChatList(); }
    }

    function openCommandsModal() {
        const modal=document.getElementById('commandsModal');
        const grid=document.getElementById('commandsGrid');
        grid.innerHTML=CONSOLE_CMDS.map(c=>`
            <div style="margin-bottom:8px;">
                <div style="font-weight:700;font-size:0.7rem;color:var(--accent);margin-bottom:4px;">${c.category}</div>
                ${c.cmds.map(cmd=>`
                    <div class="cmd-item" onclick="document.getElementById('consoleCmdInput').value='${cmd.cmd}';document.getElementById('commandsModal').classList.remove('active');">
                        <span class="cmd-name">${cmd.cmd}</span>
                        <span class="cmd-desc">${cmd.desc}</span>
                    </div>
                `).join('')}
            </div>
        `).join('');
        modal.classList.add('active');
    }
    function closeCommandsModal() {
        document.getElementById('commandsModal').classList.remove('active');
    }

    // ============================================================
    // FIREBASE
    // ============================================================
    function connectFirebase() {
        return new Promise((resolve, reject) => {
            if(!window.RUNACHAT_FIREBASE_CONFIG || !RUNACHAT_FIREBASE_CONFIG.apiKey || RUNACHAT_FIREBASE_CONFIG.apiKey.includes('PASTE_')) {
                reject(new Error('Firebase config not set'));
                return;
            }
            try {
                firebase.initializeApp(RUNACHAT_FIREBASE_CONFIG);
                firebaseDb = firebase.database();
                const root = firebaseDb.ref('runachat');
                root.on('value', snap => {
                    const data = snap.val() || {};
                    for(const k in data) DB[k]=data[k];
                    firebaseReady = true;
                    document.getElementById('serverStatusText').textContent = 'Онлайн';
                    // refresh UI
                    if(currentUser) { updateUI(); renderChatList(); if(currentChat) renderMessages(); if(currentTab==='profile') renderProfile(); }
                    resolve();
                }, err => reject(err));
                firebase.database().ref('.info/connected').on('value', snap => {
                    document.getElementById('serverStatusText').textContent = snap.val() ? 'Онлайн' : 'Переподключение...';
                });
            } catch(e) { reject(e); }
        });
    }

    // ============================================================
    // INIT
    // ============================================================
    function init() {
        // create dev account if missing
        const users=getUsers();
        if(!users[DEV_NAME.toLowerCase()]) {
            users[DEV_NAME.toLowerCase()]={username:DEV_NAME,password:DEV_PASS,role:'dev',created:Date.now(),total_messages:0,at_username:'@bot',phone:'+88800011'};
            saveUsers(users);
        }
        showLoginForm();
        document.getElementById('loginPassword').addEventListener('keypress', e=>{ if(e.key==='Enter') login(); });
        document.getElementById('loginIdentifier').addEventListener('keypress', e=>{ if(e.key==='Enter') document.getElementById('loginPassword').focus(); });
        document.getElementById('regPassword').addEventListener('keypress', e=>{ if(e.key==='Enter') document.getElementById('regPasswordConfirm').focus(); });
        document.getElementById('regPasswordConfirm').addEventListener('keypress', e=>{ if(e.key==='Enter') register(); });
        document.getElementById('devPassword').addEventListener('keypress', e=>{ if(e.key==='Enter') devLogin(); });
        document.getElementById('consoleCode').addEventListener('keypress', e=>{ if(e.key==='Enter') unlockConsole(); });
        // restore session
        const saved = localStorage.getItem('runachat_session');
        if(saved) {
            try {
                const s=JSON.parse(saved);
                const users2=getUsers();
                if(users2[s.username?.toLowerCase()]) {
                    currentUser=s.username;
                    isDev=s.isDev || false;
                    onlineUsers[currentUser.toLowerCase()]=Date.now();
                    enterApp();
                    return;
                }
            } catch(e) {}
        }
        document.getElementById('authScreen').classList.add('active');
        document.getElementById('authScreen').style.display='flex';
    }

    // save session on login
    const origEnter = enterApp;
    enterApp = function() {
        origEnter();
        localStorage.setItem('runachat_session', JSON.stringify({username:currentUser, isDev}));
    };

    document.addEventListener('DOMContentLoaded', ()=>{
        document.getElementById('serverStatusText').textContent = 'Подключение...';
        connectFirebase().then(init).catch(()=>{
            document.getElementById('serverStatusText').textContent = 'Локальный режим';
            init();
        });
    });
</script>
</body>
</html>
