<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RunaChat Pro – Neon Edition</title>
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&family=JetBrains+Mono:wght@400;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --neon-red:#ff1a1a; --neon-darkred:#cc0000; --neon-pink:#ff3366;
      --neon-coral:#ff4444; --neon-bright:#ff5555; --neon-green:#00ff88;
      --crown-red:#ff1a1a; --crown-glow-red:#ff0000;
      --console-red:#ff3333; --console-dim:#991111;
      --dark-bg:#0a0000; --darker-bg:#050000;
      --panel-bg:rgba(20,0,0,0.9); --glass:rgba(25,0,0,0.75);
      --text:#ffe0e0; --text-dim:#996666;
      --border:rgba(255,26,26,0.25); --radius:14px; --radius-sm:10px;
      --glow-red:0 0 20px rgba(255,0,0,0.4); --glow-green:0 0 15px rgba(0,255,136,0.4);
    }
    body {
      font-family:'Roboto',sans-serif; background:var(--dark-bg); color:var(--text);
      min-height:100vh; display:flex; justify-content:center; align-items:center;
      background-image:radial-gradient(ellipse at 15% 10%,rgba(255,0,0,0.08) 0%,transparent 55%),
        radial-gradient(ellipse at 85% 90%,rgba(180,0,0,0.06) 0%,transparent 55%),
        linear-gradient(180deg,#0a0000 0%,#0d0000 40%,#080000 100%);
      background-attachment:fixed;
    }
    .app-container {
      width:100%; max-width:520px; height:92vh; max-height:820px;
      background:var(--panel-bg); border:1px solid var(--border); border-radius:24px;
      display:flex; flex-direction:column; overflow:hidden;
      backdrop-filter:blur(30px); box-shadow:0 0 60px rgba(255,0,0,0.1);
      position:relative;
    }
    .app-container::before {
      content:''; position:absolute; top:-2px; left:15%; right:15%; height:2px;
      background:linear-gradient(90deg,transparent,var(--neon-red),var(--neon-pink),var(--neon-red),transparent);
      opacity:0.6; border-radius:50%; z-index:10; pointer-events:none;
      animation:borderGlow 3s ease-in-out infinite;
    }
    @keyframes borderGlow { 0%,100%{opacity:0.4;filter:brightness(1)} 50%{opacity:1;filter:brightness(1.5)} }
    .header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--glass); gap:10px; }
    .header-logo { font-family:'Orbitron',monospace; font-size:1.3em; font-weight:900; background:linear-gradient(135deg,var(--neon-red),var(--neon-pink)); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:3px; cursor:pointer; animation:logoGlow 2s ease-in-out infinite; }
    @keyframes logoGlow { 0%,100%{filter:brightness(1) drop-shadow(0 0 5px rgba(255,0,0,0.5))} 50%{filter:brightness(1.3) drop-shadow(0 0 15px rgba(255,0,0,0.8))} }
    .header-actions { display:flex; align-items:center; gap:8px; }
    .server-status { display:flex; align-items:center; gap:6px; font-size:0.6em; color:var(--text-dim); font-family:'JetBrains Mono',monospace; padding:4px 10px; border-radius:20px; background:rgba(255,0,0,0.08); border:1px solid rgba(255,0,0,0.25); }
    .status-dot { width:7px; height:7px; border-radius:50%; background:var(--neon-green); box-shadow:var(--glow-green); animation:dotPulse 2s infinite; }
    @keyframes dotPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }


    .tab-nav { display:flex; border-bottom:1px solid var(--border); background:rgba(15,0,0,0.7); overflow-x:auto; scrollbar-width:none; }
    .tab-nav::-webkit-scrollbar { display:none; }
    .tab-btn { flex:1 0 auto; padding:11px 14px; background:transparent; border:none; color:var(--text-dim); font-family:'Orbitron',monospace; font-size:0.58em; letter-spacing:1px; cursor:pointer; transition:all 0.3s; text-transform:uppercase; white-space:nowrap; display:flex; align-items:center; gap:5px; }
    .tab-btn.active { color:var(--neon-red); box-shadow:inset 0 -2px 0 var(--neon-red); }
    .tab-btn:hover { color:var(--text); background:rgba(255,0,0,0.04); }
    .tab-content { display:none; flex:1; flex-direction:column; overflow:hidden; }
    .tab-content.active { display:flex; }
    .screen { display:none; flex-direction:column; flex:1; overflow:hidden; }
    .screen.active { display:flex; }
    .form-container { padding:28px 24px; gap:22px; display:flex; flex-direction:column; overflow-y:auto; }
    .cyber-input-group { width:100%; position:relative; }
    .cyber-input-group label { display:block; font-family:'Orbitron',monospace; font-size:0.6em; letter-spacing:1.5px; color:var(--neon-pink); margin-bottom:8px; text-transform:uppercase; }
    .cyber-input { width:100%; padding:13px 16px; background:var(--darker-bg); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-size:0.9em; outline:none; transition:all 0.3s; }
    .cyber-input:focus { border-color:var(--neon-red); box-shadow:0 0 25px rgba(255,0,0,0.2); }
    .input-with-icon { position:relative; }
    .input-with-icon .cyber-input { padding-right:40px; }
    .input-icon { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-dim); cursor:pointer; font-size:1.1em; }
    .btn { padding:14px 28px; border:none; border-radius:var(--radius-sm); font-family:'Orbitron',monospace; font-size:0.75em; font-weight:700; letter-spacing:2px; cursor:pointer; transition:all 0.3s; text-transform:uppercase; display:inline-flex; align-items:center; justify-content:center; gap:6px; position:relative; overflow:hidden; margin-bottom:6px; }
    .btn-primary { background:linear-gradient(135deg,rgba(255,0,0,0.25),rgba(200,0,0,0.12)); border:1px solid var(--neon-red); color:var(--neon-red); width:100%; }
    .btn-dev { background:linear-gradient(135deg,rgba(255,26,26,0.25),rgba(200,0,0,0.12)); border:1px solid var(--crown-red); color:var(--crown-red); width:100%; }
    .btn-register { background:linear-gradient(135deg,rgba(255,85,85,0.25),rgba(200,50,50,0.12)); border:1px solid var(--neon-bright); color:var(--neon-bright); width:100%; }
    .btn-logout { background:transparent; border:1px solid rgba(255,51,102,0.4); color:var(--neon-pink); font-size:0.6em; padding:8px 16px; margin-bottom:0; }
    .btn-sm { padding:8px 16px; font-size:0.6em; }
    .btn-xs { padding:4px 8px; font-size:0.5em; letter-spacing:0.5px; border-radius:6px; cursor:pointer; }
    .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-family:'Orbitron',monospace; font-size:0.55em; letter-spacing:1px; font-weight:700; }
    .badge-user { background:rgba(255,0,0,0.2); border:1px solid var(--neon-red); color:var(--neon-red); }
    .badge-console { background:rgba(255,0,0,0.25); border:1px solid var(--console-red); color:var(--console-red); }

    .crown-icon { display:inline-flex; font-size:1em; filter:drop-shadow(0 0 6px rgba(255,0,0,0.8)) drop-shadow(0 0 12px rgba(200,0,0,0.5)); animation:crownGlow 2s ease-in-out infinite; }
    @keyframes crownGlow { 0%,100%{filter:drop-shadow(0 0 6px rgba(255,0,0,0.8))} 50%{filter:drop-shadow(0 0 14px rgba(255,0,0,1))} }
    .verified-check { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:linear-gradient(135deg,#ff4444,#cc0000); color:#fff; font-size:0.55em; font-weight:900; box-shadow:0 0 8px rgba(255,0,0,0.6); margin-left:6px; }
    .user-info-bar { display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:rgba(15,0,0,0.6); border-bottom:1px solid var(--border); gap:8px; cursor:pointer; }
    .user-info-left { display:flex; align-items:center; gap:8px; }
    .user-avatar { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85em; font-weight:bold; background-size:cover; background-position:center; overflow:hidden; }
    .user-avatar img { width:100%; height:100%; object-fit:cover; }
    .user-avatar.dev { background:linear-gradient(135deg,var(--crown-red),var(--crown-glow-red)); }
    .user-avatar.user { background:linear-gradient(135deg,var(--neon-red),var(--neon-pink)); }
    .user-avatar.large { width:64px; height:64px; font-size:1.8em; }

    .chat-header { padding:12px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--glass); gap:8px; }
    .room-name { font-family:'Orbitron',monospace; font-size:0.7em; color:var(--neon-red); }
    .messages-area { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; background:rgba(8,0,0,0.5); scroll-behavior:smooth; }
    .message { max-width:100%; padding:10px 13px; border-radius:14px; word-wrap:break-word; line-height:1.4; }
    .message-sent { background:linear-gradient(135deg,rgba(255,0,0,0.25),rgba(200,0,0,0.08)); border:1px solid rgba(255,0,0,0.25); border-bottom-right-radius:4px; }
    .message-received { background:rgba(20,0,0,0.85); border:1px solid rgba(255,255,255,0.08); border-bottom-left-radius:4px; }
    .message-console { background:linear-gradient(135deg,rgba(255,50,50,0.3),rgba(150,0,0,0.15)); border:1px solid rgba(255,50,50,0.4); }
    .message-wrapper { display:flex; gap:6px; align-items:flex-end; max-width:90%; }
    .message-wrapper.sent { align-self:flex-end; flex-direction:row-reverse; }
    .message-wrapper.received { align-self:flex-start; }
    .message-avatar { width:26px; height:26px; border-radius:50%; background-size:cover; background-position:center; flex-shrink:0; cursor:pointer; transition:all 0.25s; display:flex; align-items:center; justify-content:center; font-size:0.65em; font-weight:bold; background:linear-gradient(135deg,var(--neon-red),var(--neon-pink)); border:1px solid rgba(255,255,255,0.1); overflow:hidden; }
    .message-avatar img { width:100%; height:100%; object-fit:cover; }
    .message-avatar:hover { transform:scale(1.2); box-shadow:0 0 12px rgba(255,0,0,0.5); z-index:2; }
    .message-sender-name { font-size:0.65em; color:var(--neon-pink); }
    .message-sender-name.dev-name { color:var(--crown-red); }
    .message-sender-name.console-name { font-weight:900; font-size:0.75em; letter-spacing:1px; background:linear-gradient(135deg, #ff1a1a, #ff4444, #ff1a1a, #ff6666, #ff1a1a); background-size:300% 300%; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:consoleNickGlow 2s ease-in-out infinite; filter:drop-shadow(0 0 4px rgba(255,0,0,0.6)); }
    @keyframes consoleNickGlow { 0%{background-position:0% 50%;filter:drop-shadow(0 0 4px rgba(255,0,0,0.6))} 25%{background-position:100% 0%;filter:drop-shadow(0 0 8px rgba(255,50,50,0.8))} 50%{background-position:100% 100%;filter:drop-shadow(0 0 12px rgba(255,0,0,1))} 75%{background-position:0% 100%;filter:drop-shadow(0 0 8px rgba(255,50,50,0.8))} 100%{background-position:0% 50%;filter:drop-shadow(0 0 4px rgba(255,0,0,0.6))} }
    .message-sender-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; flex-wrap:wrap; }
    .message-text { font-size:0.85em; }
    .custom-gradient-text { display:inline-block; max-width:100%; color:var(--neon-bright); background-repeat:no-repeat; background-size:300% 300%; will-change:background-position,filter; animation-name:devMessageGradient; animation-timing-function:ease-in-out; animation-iteration-count:infinite; }
    @supports ((-webkit-background-clip:text) or (background-clip:text)) {
      .custom-gradient-text { -webkit-background-clip:text !important; background-clip:text !important; -webkit-text-fill-color:transparent; color:transparent; }
    }
    @keyframes devMessageGradient {
      0%{background-position:0% 50%;filter:drop-shadow(0 0 4px rgba(255,0,0,0.5))}
      25%{background-position:100% 0%;filter:drop-shadow(0 0 8px rgba(255,50,50,0.8))}
      50%{background-position:100% 100%;filter:drop-shadow(0 0 12px rgba(255,0,0,1))}
      75%{background-position:0% 100%;filter:drop-shadow(0 0 8px rgba(255,50,50,0.8))}
      100%{background-position:0% 50%;filter:drop-shadow(0 0 4px rgba(255,0,0,0.5))}
    }

    .dev-rainbow {
      background:linear-gradient(270deg, #ff0000, #ff7700, #ffff00, #00ff00, #0000ff, #8b00ff, #ff0000);
      background-size:400% 400%;
      -webkit-background-clip:text;
      background-clip:text;
      -webkit-text-fill-color:transparent;
      animation:rainbowFlow 3s linear infinite;
      font-weight:900;
      text-shadow:none;
    }
    @keyframes rainbowFlow { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }

    .system-message { text-align:center; font-size:0.65em; color:var(--text-dim); padding:5px; }
    .input-area { padding:10px 14px; border-top:1px solid var(--border); display:flex; gap:6px; background:var(--glass); align-items:center; position:relative; }
    .input-area .cyber-input { flex:1; padding:10px 12px; font-size:0.85em; }
    .send-btn { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,rgba(255,0,0,0.3),rgba(200,0,0,0.15)); border:1px solid var(--neon-red); color:var(--neon-red); cursor:pointer; font-size:1.1em; display:flex; align-items:center; justify-content:center; transition:all 0.3s; }
    .send-btn:disabled { opacity:0.5; cursor:not-allowed; }

    .toast { position:fixed; top:20px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:20px; font-family:'Orbitron',monospace; font-size:0.7em; z-index:999; pointer-events:none; animation:slideDown 0.4s ease, fadeOut 0.4s ease 2.5s forwards; }
    .toast.success { background:rgba(255,0,0,0.25); border:1px solid var(--neon-red); color:var(--neon-bright); }
    .toast.error { background:rgba(255,51,102,0.25); border:1px solid var(--neon-pink); color:var(--neon-pink); }
    @keyframes slideDown { from{transform:translateX(-50%) translateY(-80px);opacity:0} to{transform:translateX(-50%) translateY(0);opacity:1} }
    @keyframes fadeOut { to{opacity:0;transform:translateX(-50%) translateY(-15px)} }


    .reg-step { display:none; flex-direction:column; gap:18px; }
    .reg-step.active { display:flex; animation:fadeInStep 0.3s ease; }
    @keyframes fadeInStep { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

    #atUsernameStatus.available { color: var(--neon-green); }
    #atUsernameStatus.unavailable { color: var(--neon-pink); }
    .mention-link { color: var(--neon-red); cursor: pointer; text-decoration: underline; }
    .mention-link:hover { filter: brightness(1.2); }

    .profile-edit-row { display:flex; align-items:center; gap:10px; }
    .profile-edit-row input { flex:1; }
    .avatar-upload-btn { position:absolute; bottom:5px; right:5px; background:var(--neon-red); border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:0.8em; }


    .hacker-bg { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; opacity:0.15; }
    .hacker-char { position:absolute; color:var(--neon-red); font-family:'JetBrains Mono',monospace; font-size:0.9em; animation:fall linear infinite; opacity:0.6; text-shadow:0 0 6px rgba(255,0,0,0.5); }
    @keyframes fall { 0%{transform:translateY(-30px) rotate(0deg);opacity:0.7} 60%{opacity:0.5} 100%{transform:translateY(105vh) rotate(360deg);opacity:0.1} }
    .console-output-area { flex:1; padding:10px; font-family:'JetBrains Mono',monospace; font-size:0.6em; overflow-y:auto; background:rgba(5,0,0,0.7); border:1px solid var(--border); border-radius:8px; min-height:200px; position:relative; z-index:1; }
    .console-input-row { padding:8px 10px; border-top:1px solid var(--border); display:flex; gap:5px; background:rgba(10,0,0,0.9); align-items:center; position:relative; z-index:1; }

    .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.88); z-index:900; justify-content:center; align-items:center; backdrop-filter:blur(8px); }
    .modal-overlay.active { display:flex; }
    .modal-container { width:90%; max-width:440px; max-height:85vh; background:var(--panel-bg); border:1px solid var(--border); border-radius:var(--radius); overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 0 50px rgba(255,0,0,0.2); position:relative; }
    .modal-close { position:absolute; top:10px; right:10px; background:rgba(15,0,0,0.9); border:1px solid var(--border); color:var(--text-dim); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:0.9em; display:flex; align-items:center; justify-content:center; z-index:5; }

    @media (max-width:540px) { 
      .app-container { height:100vh; max-height:none; border-radius:0; border:none; } 
      .tab-btn { font-size:0.5em; padding:10px 6px; } 
    }
  </style>
</head>
<body>
<div class="app-container" id="appContainer">
  <div class="header">
    <div class="header-logo" onclick="goHome()">◆ RUNACHAT</div>
    <div class="header-actions">
      <div class="server-status" id="serverStatus">
        <span class="status-dot"></span>
        <span id="serverStatusText">Локальный режим</span>
      </div>
    </div>
  </div>


  <div class="screen active" id="authScreen">
    <div class="form-container" style="justify-content:center;flex:1;">
      <div style="text-align:center;margin-bottom:12px;">
        <div style="font-family:'Orbitron',monospace;font-size:1.8em;background:linear-gradient(135deg,#ff1a1a,#ff3366);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">◆ RUNACHAT ◆</div>
      </div>
      <div id="loginForm">
        <div class="cyber-input-group"><label>👤 Имя или @username</label><input type="text" class="cyber-input" id="loginIdentifier" placeholder="Введите имя или @username" maxlength="30" autocomplete="off"></div>
        <div class="cyber-input-group"><label>🔑 Пароль</label><div class="input-with-icon"><input type="password" class="cyber-input" id="loginPassword" placeholder="Введите пароль..." maxlength="30" autocomplete="off"><span class="input-icon" onclick="togglePass('loginPassword',this)">👁</span></div></div>
        <div style="display:flex;align-items:center;gap:6px;margin:4px 0;"><input type="checkbox" id="rememberMe" checked><label for="rememberMe" style="font-size:0.65em;color:var(--text-dim);">Запомнить меня</label></div>
        <button class="btn btn-primary" onclick="login()">◈ Войти ◈</button>
        <div class="divider"><div class="divider-line"></div><div class="divider-text">или</div><div class="divider-line"></div></div>
        <button class="btn btn-dev" onclick="showDevLogin()">👑 Вход для разработчика</button>
        <p style="font-size:0.7em;color:var(--text-dim);text-align:center;margin-top:12px;">Нет аккаунта? <span style="color:var(--neon-red);cursor:pointer;text-decoration:underline;" onclick="showRegisterForm()">Зарегистрироваться</span></p>
      </div>
      <div id="devLoginForm" style="display:none;">
        <div style="text-align:center;margin-bottom:8px;"><span class="crown-icon" style="font-size:1.4em;">👑</span></div>
        <div class="cyber-input-group"><label>👤 Имя разработчика</label><input type="text" class="cyber-input" id="devUsername" placeholder="Имя разработчика..." maxlength="20" autocomplete="off"></div>
        <div class="cyber-input-group"><label>🔑 Ключ разработчика</label><div class="input-with-icon"><input type="password" class="cyber-input" id="devPassword" placeholder="Ключ разработчика..." maxlength="30" autocomplete="off"><span class="input-icon" onclick="togglePass('devPassword',this)">👁</span></div></div>
        <button class="btn btn-dev" onclick="devLogin()">👑 Войти как разработчик</button>
        <button class="btn btn-logout" onclick="showLoginForm()" style="margin-top:4px;">← Назад</button>
      </div>

      <div id="registerForm" style="display:none;">
        <div style="text-align:center;margin-bottom:8px;"><span class="badge badge-user">🆕 НОВЫЙ АККАУНТ</span></div>
        <div class="reg-step active" id="regStep1">
          <div class="cyber-input-group">
            <label>🌐 @Username <span style="color:var(--neon-pink);">*обязательно</span></label>
            <div class="input-with-icon">
              <input type="text" class="cyber-input" id="regAtUsername" placeholder="@username" maxlength="20" autocomplete="off" oninput="checkAtUsernameAvailability()">
              <span class="input-icon" id="atUsernameStatus" style="font-size:0.8em;">⏳</span>
            </div>
            <small id="atUsernameHint" style="color:var(--text-dim);font-size:0.55em;">4–20 символов (a-z, 0-9, _), начинается с буквы</small>
          </div>
          <button class="btn btn-register" id="regNext1" disabled onclick="goToRegStep(2)">Далее</button>
        </div>
        <div class="reg-step" id="regStep2">
          <div class="cyber-input-group"><label>🔑 Пароль (6+)</label><div class="input-with-icon"><input type="password" class="cyber-input" id="regPassword" placeholder="Минимум 6 символов..." maxlength="30" autocomplete="off"><span class="input-icon" onclick="togglePass('regPassword',this)">👁</span></div></div>
          <button class="btn btn-register" id="regNext2" disabled onclick="goToRegStep(3)">Далее</button>
        </div>
        <div class="reg-step" id="regStep3">
          <div class="cyber-input-group"><label>🔑 Подтверждение пароля</label><input type="password" class="cyber-input" id="regPasswordConfirm" placeholder="Повторите пароль..." maxlength="30" autocomplete="off"></div>
          <button class="btn btn-register" id="regFinishBtn" disabled onclick="register()">◆ Создать аккаунт ◆</button>
        </div>

<script>

  const STORAGE_KEY = 'runachat_local_';
  const DEV_NAME = 'Runachak'; const DEV_PASSWORD = 'qwe'; const CONSOLE_CODE = 'VGX233';
  const CONSOLE_USERNAME = 'Console';
  const GLOBAL_ROOM = 'global'; 

  let currentUser = '', currentRoom = GLOBAL_ROOM, isDev = false, consoleUnlocked = false;
  let currentTab = 'chat'; let hackerInterval = null;
  let isSendingMessage = false;


  let firebaseDb, firebaseReady = false, onlineData = {}, appInitialized = false;

  const CONSOLE_COMMANDS = [
    { category: '📊 Информация', commands: [{ cmd: 'help', desc: 'Показать все команды' }, { cmd: 'users', desc: 'Список пользователей' }, { cmd: 'user <name>', desc: 'Детали пользователя' }, { cmd: 'bans', desc: 'Список банов' }, { cmd: 'phones', desc: 'Телефоны' }, { cmd: 'usernames', desc: 'Список @username' }, { cmd: 'online', desc: 'Пользователи онлайн' }] },
    { category: '💬 Сообщения', commands: [{ cmd: 'say <текст>', desc: 'Отправить сообщение в общий чат' }] },
    { category: '🛡 Модерация', commands: [{ cmd: 'ban <user> <mins> <reason>', desc: 'Забанить' }, { cmd: 'unban <user>', desc: 'Разбанить' }] },
    { category: '📱 Телефоны', commands: [{ cmd: 'setphone <user> <phone>', desc: 'Назначить номер' }, { cmd: 'nophone <user>', desc: 'Удалить номер' }, { cmd: 'devphone <phone>', desc: 'Сменить номер разр.' }] },
    { category: '🔖 @Username', commands: [{ cmd: 'setusername <user> <@name>', desc: 'Назначить' }, { cmd: 'nousername <user>', desc: 'Удалить' }] },
    { category: '👤 Профиль', commands: [{ cmd: 'setnick <user> <nick>', desc: 'Сменить ник' }, { cmd: '/nickrgb <user> <#цвет>', desc: 'Анимированный цвет ника' }, { cmd: 'setavatar <user> <url>', desc: 'Установить аватар (URL)' }] },
    { category: '⚙ Управление', commands: [{ cmd: '/dev <user>', desc: 'Назначить разработчиком' }, { cmd: '/undev <user>', desc: 'Снять права разработчика' }, { cmd: 'stats <user> <field> <val>', desc: 'Статистика' }, { cmd: 'deleteuser <user>', desc: 'Удалить польз.' }, { cmd: 'cleanup', desc: 'Очистить' }] },
    { category: '🖥 Консоль', commands: [{ cmd: 'clear', desc: 'Очистить вывод' }, { cmd: 'lock', desc: 'Заблокировать' }] }
  ];


  function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
  function togglePass(id, icon) { const i = document.getElementById(id); if (i.type === 'password') { i.type = 'text'; icon.textContent = '🙈'; } else { i.type = 'password'; icon.textContent = '👁'; } }
  function formatAtUsername(raw) { let cleaned = raw.trim().replace(/\s/g, ''); if (!cleaned.startsWith('@')) cleaned = '@' + cleaned; return cleaned; }


  function goToRegStep(step) {
    document.querySelectorAll('.reg-step').forEach(el => el.classList.remove('active'));
    document.getElementById('regStep'+step).classList.add('active');
    if (step === 1) {
      document.getElementById('regNext1').disabled = !isAtUsernameValid();
      document.getElementById('regAtUsername').focus();
    } else if (step === 2) {
      document.getElementById('regPassword').focus();
      updateRegStep2Button();
    } else if (step === 3) {
      document.getElementById('regPasswordConfirm').focus();
      updateRegFinishButton();
    }
  }
  function isAtUsernameValid() {
    const raw = document.getElementById('regAtUsername').value.trim();
    const at = formatAtUsername(raw);
    return /^@[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(at);
  }
  function checkAtUsernameAvailability() {
    const input = document.getElementById('regAtUsername');
    const icon = document.getElementById('atUsernameStatus');
    const hint = document.getElementById('atUsernameHint');
    const raw = input.value.trim();
    if (!raw) { icon.textContent = '⏳'; icon.className = 'input-icon'; return; }
    const atUsername = formatAtUsername(raw);
    if (!/^@[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(atUsername)) {
      icon.textContent = '❌'; icon.className = 'input-icon unavailable';
      hint.textContent = '4–20 символов (a-z, 0-9, _), начинается с буквы'; hint.style.color = 'var(--neon-pink)';
    } else {
      const users = getUsers();
      const exists = Object.values(users).some(u => u.at_username && u.at_username.toLowerCase() === atUsername.toLowerCase());
      if (exists) {
        icon.textContent = '🚫'; icon.className = 'input-icon unavailable';
        hint.textContent = `@${atUsername.slice(1)} уже занят`; hint.style.color = 'var(--neon-pink)';
      } else {
        icon.textContent = '✅'; icon.className = 'input-icon available';
        hint.textContent = `@${atUsername.slice(1)} свободен`; hint.style.color = 'var(--neon-green)';
      }
    }
    document.getElementById('regNext1').disabled = !(icon.classList.contains('available'));
  }
  function updateRegStep2Button() {
    const p = document.getElementById('regPassword').value;
    document.getElementById('regNext2').disabled = p.length < 6;
  }
  function updateRegFinishButton() {
    const p = document.getElementById('regPassword').value;
    const pc = document.getElementById('regPasswordConfirm').value;
    document.getElementById('regFinishBtn').disabled = p.length < 6 || p !== pc;
  }
  document.addEventListener('input', function(e) {
    if (e.target.id === 'regPassword') updateRegStep2Button();
    if (e.target.id === 'regPassword' || e.target.id === 'regPasswordConfirm') updateRegFinishButton();
  });


  function saveData(k, d) { onlineData[k] = d; if (firebaseReady && firebaseDb) firebaseDb.ref('runachat/' + k).set(d).catch(e => console.error(e)); }
  function loadData(k) { return onlineData[k] ?? null; }
  function getUsers() { return loadData('users') || {}; }
  function saveUsers(u) { saveData('users', u); }
  function getMessages() { return loadData('messages') || {}; }
  function saveMessages(m) { saveData('messages', m); }
  function getOnlineUsers() { return loadData('online') || {}; }
  function saveOnlineUsers(o) { saveData('online', o); }
  function getBans() { return loadData('bans') || {}; }
  function saveBans(b) { saveData('bans', b); }
  function getActivities() { return loadData('activities') || {}; }
  function saveActivities(a) { saveData('activities', a); }
  function getAvatars() { return loadData('avatars') || {}; }
  function saveAvatars(a) { saveData('avatars', a); }
  function getUserAvatar(username) { return (getAvatars())[username.toLowerCase()] || null; }
  function setUserAvatar(username, url) { const a = getAvatars(); a[username.toLowerCase()] = url; saveAvatars(a); }

  function getDisplayName(username) { const n = loadData('nicknames') || {}; return n[username.toLowerCase()] || username; }
  function setDisplayName(username, nick) { const n = loadData('nicknames') || {}; n[username.toLowerCase()] = nick; saveData('nicknames', n); }
  function getDisplayNameHTML(username) {
    const name = escapeHtml(getDisplayName(username));
    const users = getUsers();
    const isDevUser = (users[username.toLowerCase()] || {}).role === 'dev';
    if (isDevUser) return `<span class="dev-rainbow">${name}</span>`;  
    return name;
  }


  function triggerAvatarUpload() { document.getElementById('avatarFileInput').click(); }
  function handleAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('❌ Только изображения', 'error'); return; }
    if (file.size > 500 * 1024) { showToast('❌ Максимум 500KB', 'error'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      setUserAvatar(currentUser, e.target.result);
      updateUserUI();
      if (currentTab === 'profile') renderProfile();
      showToast('✅ Аватар обновлён!', 'success');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }


  function updateUserUI() {
    document.getElementById('displayUsername').innerHTML = getDisplayNameHTML(currentUser);
    document.getElementById('consoleTabBtn').style.display = isDev ? 'inline-block' : 'none';
    const av = document.getElementById('userAvatar');
    const avatarUrl = getUserAvatar(currentUser);
    av.innerHTML = avatarUrl ? `<img src="${avatarUrl}" alt="avatar">` : (isDev ? '👑' : currentUser.charAt(0).toUpperCase());
    av.className = 'user-avatar' + (isDev ? ' dev' : ' user');
    document.getElementById('verifiedCheck').style.display = isDev ? 'inline-flex' : 'none';
    document.getElementById('userBadge').innerHTML = isDev ? '' : '<span class="badge badge-user">USER</span>';
  }

  function buildProfileHTML(username) {
    const users = getUsers();
    const u = users[username.toLowerCase()];
    if (!u) return '<p>Пользователь не найден</p>';
    const isDevU = u.role === 'dev';
    const avatarUrl = getUserAvatar(username);
    const displayName = getDisplayName(username);
    const createdDate = new Date(u.created).toLocaleDateString();
    const online = isUserOnline(username);
    const activities = getActivities();
    const userActs = (activities[username] || []).slice(-8).reverse();

    let html = `
      <div style="text-align:center;">
        <div class="user-avatar large ${isDevU?'dev':'user'}" style="margin:0 auto;position:relative;" id="profileAvatar">
          ${avatarUrl ? `<img src="${avatarUrl}" style="width:100%;height:100%;object-fit:cover;">` : (isDevU?'👑':username.charAt(0).toUpperCase())}
          ${username === currentUser ? '<div class="avatar-upload-btn" onclick="triggerAvatarUpload()">📷</div>' : ''}
        </div>
        <div style="display:flex;align-items:center;justify-content:center;gap:4px;margin-top:10px;">
          <span style="font-family:'Orbitron',monospace;font-size:1.2em;">${getDisplayNameHTML(username)}</span>
          ${isDevU?'<span class="verified-check">✓</span>':''}
          ${!isDevU?'<span class="badge badge-user">USER</span>':''}
        </div>
        ${u.at_username ? `<div style="margin-top:4px;color:var(--neon-red);font-size:0.75em;">${escapeHtml(u.at_username)}</div>` : ''}
        ${isDevU?'<div style="margin-top:4px;color:var(--crown-red);font-size:0.7em;">👑 Системный разработчик</div>':''}
        <div style="color:${online?'var(--neon-green)':'var(--text-dim)'};font-size:0.65em;margin-top:4px;">${online?'● Онлайн':'○ Офлайн'}</div>
      </div>
      <div class="profile-stats">
        <div class="stat-card"><div class="stat-value">${u.total_messages||0}</div><div class="stat-label">Сообщений</div></div>
      </div>
      <div class="profile-info-card">
        <div class="info-row"><span class="info-label">Имя</span><span class="info-value">${escapeHtml(displayName)}</span></div>
        <div class="info-row"><span class="info-label">Логин</span><span class="info-value">${escapeHtml(username)}</span></div>
        <div class="info-row"><span class="info-label">@Username</span><span class="info-value" id="profileAtUsernameValue">${u.at_username||'<span style="color:var(--text-dim);">Не задан</span>'}</span></div>
        ${username === currentUser ? `<div class="info-row"><button class="btn btn-xs" onclick="startEditUsername()">✏ Изменить @username</button></div>` : ''}
        <div class="info-row"><span class="info-label">Телефон</span><span class="info-value">${u.phone||'<span style="color:var(--text-dim);">Не задан</span>'}</span></div>
        <div class="info-row"><span class="info-label">Роль</span><span class="info-value">${isDevU?'👑 Разработчик':'👤 Пользователь'}</span></div>
        <div class="info-row"><span class="info-label">Дата регистрации</span><span class="info-value">${createdDate}</span></div>
      </div>
    `;
    return html;
  }

  function startEditUsername() {
    const current = (getUsers()[currentUser.toLowerCase()] || {}).at_username || '';
    const newHtml = `
      <div class="profile-edit-row">
        <input type="text" class="cyber-input" id="editAtUsername" value="${escapeHtml(current)}" maxlength="20" oninput="checkEditAtUsername()">
        <span id="editAtStatus">⏳</span>
      </div>
      <button class="btn btn-sm" onclick="saveUsername()">💾 Сохранить</button>
      <button class="btn btn-sm btn-logout" onclick="renderProfile()">Отмена</button>
    `;
    document.getElementById('profileContent').insertAdjacentHTML('beforeend', newHtml);
  }
  function checkEditAtUsername() {
    const raw = document.getElementById('editAtUsername').value.trim();
    const at = formatAtUsername(raw);
    const status = document.getElementById('editAtStatus');
    if (!/^@[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(at)) {
      status.textContent = '❌'; status.style.color = 'var(--neon-pink)';
    } else {
      const users = getUsers();
      const exists = Object.values(users).some(u => u.at_username && u.at_username.toLowerCase() === at.toLowerCase() && u.username.toLowerCase() !== currentUser.toLowerCase());
      status.textContent = exists ? '🚫' : '✅';
      status.style.color = exists ? 'var(--neon-pink)' : 'var(--neon-green)';
    }
  }
  function saveUsername() {
    const raw = document.getElementById('editAtUsername').value.trim();
    const at = formatAtUsername(raw);
    if (!/^@[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(at)) { showToast('❌ Некорректный формат', 'error'); return; }
    const users = getUsers();
    const exists = Object.values(users).some(u => u.at_username && u.at_username.toLowerCase() === at.toLowerCase() && u.username.toLowerCase() !== currentUser.toLowerCase());
    if (exists) { showToast('❌ Этот @username уже занят', 'error'); return; }
    users[currentUser.toLowerCase()].at_username = at;
    saveUsers(users);
    updateUserUI();
    renderProfile();
    showToast('✅ @username обновлён!', 'success');
  }

  // ========== АВТОРИЗАЦИЯ ==========
  function login() {
    const id = document.getElementById('loginIdentifier').value.trim();
    const p = document.getElementById('loginPassword').value;
    if (!id || !p) { showToast('❌ Заполните все поля', 'error'); return; }
    const users = getUsers();
    let user = null;
    const il = id.toLowerCase();
    if (users[il]) user = users[il];
    else {
      for (const k in users) {
        const x = users[k];
        if (x.username.toLowerCase() === il || (x.at_username && x.at_username.toLowerCase() === il) || (x.at_username && x.at_username.toLowerCase() === '@' + il) || (x.phone && x.phone === id)) {
          user = x; break;
        }
      }
    }
    if (user && user.password === p) {
      currentUser = user.username;
      isDev = user.role === 'dev';
      if (document.getElementById('rememberMe').checked) saveSession();
      updateOnlineStatus(user.username);
      showToast('✅ Добро пожаловать!', 'success');
      enterMainApp();
    } else showToast('❌ Неверные данные', 'error');
  }

  function devLogin() {
    initDevAccount();
    const u = document.getElementById('devUsername').value.trim();
    const p = document.getElementById('devPassword').value;
    if (u.toLowerCase() === DEV_NAME.toLowerCase() && p === DEV_PASSWORD) {
      const users = getUsers();
      users[DEV_NAME.toLowerCase()] = { ...users[DEV_NAME.toLowerCase()], password: DEV_PASSWORD };
      saveUsers(users);
      currentUser = DEV_NAME; isDev = true;
      updateOnlineStatus(DEV_NAME);
      showToast('👑 Добро пожаловать!', 'success');
      document.getElementById('devUsername').value = '';
      document.getElementById('devPassword').value = '';
      enterMainApp();
    } else showToast('❌ Неверные данные', 'error');
  }

  function register() {
    const name = document.getElementById('regUsername')?.value.trim() || '';
    const rawAt = document.getElementById('regAtUsername').value.trim();
    const p = document.getElementById('regPassword').value;
    const pc = document.getElementById('regPasswordConfirm').value;
    const atUsername = formatAtUsername(rawAt);
    if (!/^@[a-zA-Z][a-zA-Z0-9_]{3,19}$/.test(atUsername)) { showToast('❌ Некорректный @username', 'error'); return; }
    const users = getUsers();
    if (Object.values(users).some(u => u.at_username && u.at_username.toLowerCase() === atUsername.toLowerCase())) { showToast('❌ @username занят', 'error'); return; }
    if (p.length < 6) { showToast('❌ Пароль минимум 6 символов', 'error'); return; }
    if (p !== pc) { showToast('❌ Пароли не совпадают', 'error'); return; }
    if (users[name.toLowerCase()]) { showToast('❌ Имя занято', 'error'); return; }
    users[name.toLowerCase()] = {
      username: name, password: p, role: 'user', created: Date.now(),
      total_messages: 0, phone: null, at_username: atUsername
    };
    saveUsers(users);
    showToast('✅ Аккаунт создан!', 'success');
    document.getElementById('loginIdentifier').value = name;
    showLoginForm();
  }

  function logout() {
    currentUser = ''; isDev = false; consoleUnlocked = false;
    stopHackerBg();
    clearSession();
    document.getElementById('mainAppScreen').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
    showLoginForm();
  }

  function initDevAccount() {
    const users = getUsers();
    if (!users[DEV_NAME.toLowerCase()]) {
      users[DEV_NAME.toLowerCase()] = {
        username: DEV_NAME, password: DEV_PASSWORD, role: 'dev', created: Date.now(),
        total_messages: 0, phone: '+88800011', at_username: '@runachak'
      };
      saveUsers(users);
    }
  }

  function enterMainApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('mainAppScreen').style.display = 'flex';
    updateUserUI();
    updateOnlineStatus(currentUser);
    currentRoom = GLOBAL_ROOM;
    switchTab('chat');
    refreshChat();
  }


  function sendMessage() {
    if (isSendingMessage) return;
    const t = document.getElementById('messageInput').value.trim();
    if (!t) return;
    isSendingMessage = true;
    document.getElementById('sendBtn').disabled = true;
    try {
      const messages = getMessages();
      if (!messages[GLOBAL_ROOM]) messages[GLOBAL_ROOM] = [];
      messages[GLOBAL_ROOM].push({ type:'message', sender: currentUser, text: t, time: Date.now(), is_dev: isDev });
      if (messages[GLOBAL_ROOM].length > 200) messages[GLOBAL_ROOM] = messages[GLOBAL_ROOM].slice(-200);
      saveMessages(messages);
      const users = getUsers();
      if (users[currentUser.toLowerCase()]) users[currentUser.toLowerCase()].total_messages++;
      saveUsers(users);
      updateOnlineStatus(currentUser);
      document.getElementById('messageInput').value = '';
      refreshChat();
    } catch(e) { console.error(e); }
    finally { isSendingMessage = false; document.getElementById('sendBtn').disabled = false; }
  }

  function refreshChat() {
    const msgs = (getMessages()[GLOBAL_ROOM] || []);
    renderMessages(msgs);
  }

  function renderMessages(messages) {
    const area = document.getElementById('messagesArea');
    if (!area) return;
    const wasAtBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 50;
    area.innerHTML = '';
    if (!messages.length) { area.innerHTML = '<div class="system-message">Нет сообщений</div>'; return; }
    messages.forEach(m => {
      if (m.type === 'system') {
        const d = document.createElement('div'); d.className = 'system-message'; d.textContent = m.text; area.appendChild(d);
      } else {
        const isMine = m.sender === currentUser;
        const isCon = m.is_console;
        const w = document.createElement('div'); w.className = `message-wrapper ${isMine?'sent':'received'}`;
        const md = document.createElement('div');
        let mc = 'message ';
        if (isMine) mc += 'message-sent';
        else if (isCon) mc += 'message-received message-console';
        else mc += 'message-received';
        md.className = mc;
        const sDev = m.is_dev;
        const nc = sDev ? ' dev-name' : (isCon ? ' console-name' : '');
        const senderUser = getUsers()[m.sender.toLowerCase()];
        const senderAt = senderUser?.at_username || '';
        const senderHTML = !isMine ? `<div class="message-sender-row"><span class="message-sender-name${nc}">⬡ ${isCon ? escapeHtml(CONSOLE_USERNAME) : getDisplayNameHTML(m.sender)}</span>${sDev?'<span class="verified-check">✓</span>':''}${senderAt ? `<span class="mention-link" onclick="showUserProfile('${m.sender}')">${escapeHtml(senderAt)}</span>` : ''}</div>` : '';
        md.innerHTML = `${senderHTML}<div class="message-text">${escapeHtml(m.text)}</div><div class="message-meta">${new Date(m.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
        if (!isMine) {
          const av = getAvatarHTML(m.sender);
          w.innerHTML = av;
        }
        w.appendChild(md); area.appendChild(w);
      }
    });
    if (wasAtBottom) area.scrollTop = area.scrollHeight;
  }

  function getAvatarHTML(username) {
    const avatarUrl = getUserAvatar(username);
    const isDevUser = (getUsers()[username.toLowerCase()] || {}).role === 'dev';
    const onclick = username !== CONSOLE_USERNAME ? `onclick="showUserProfile('${username}')"` : '';
    if (avatarUrl) return `<div class="message-avatar" style="background-image:url('${avatarUrl}');background-size:cover;" ${onclick}></div>`;
    const letter = isDevUser ? '👑' : username.charAt(0).toUpperCase();
    return `<div class="message-avatar" ${onclick}>${letter}</div>`;
  }


  function handleSearchInput() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    const res = document.getElementById('searchResults');
    if (!q) { res.style.display = 'none'; return; }
    const users = getUsers();
    const results = [];
    for (const k in users) {
      if (k === currentUser.toLowerCase()) continue;
      const u = users[k];
      if (u.at_username && u.at_username.toLowerCase().includes(q)) {
        results.push({ username: u.username, at_username: u.at_username, role: u.role, online: isUserOnline(u.username) });
      }
    }
    if (!results.length) {
      res.innerHTML = '<div style="padding:12px;color:var(--text-dim);text-align:center;">Никого не найдено</div>';
    } else {
      res.innerHTML = results.map(u => {
        const avatarUrl = getUserAvatar(u.username);
        const avHTML = avatarUrl ? `<div class="user-avatar ${u.role==='dev'?'dev':'user'}" style="width:28px;height:28px;background-image:url('${avatarUrl}');background-size:cover;"></div>` : `<div class="user-avatar ${u.role==='dev'?'dev':'user'}" style="width:28px;height:28px;">${u.role==='dev'?'👑':u.username.charAt(0).toUpperCase()}</div>`;
        return `<div style="padding:10px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,0.04);" onclick="showUserProfile('${u.username}')">${avHTML}<div><span style="font-size:0.8em;">${getDisplayNameHTML(u.username)}</span> <span style="color:var(--neon-red);">${escapeHtml(u.at_username)}</span></div></div>`;
      }).join('');
    }
    res.style.display = 'block';
  }


  function showUserProfile(username) {
    if (username === currentUser) { switchTab('profile'); return; }
    const modal = document.getElementById('userProfileModal');
    document.getElementById('userProfileModalContent').innerHTML = `<button class="modal-close" onclick="closeUserProfileModal()">✕</button>${buildProfileHTML(username)}`;
    modal.classList.add('active');
  }
  function closeUserProfileModal(e) { if (e && e.target !== document.getElementById('userProfileModal')) return; document.getElementById('userProfileModal').classList.remove('active'); }


  function unlockConsole() {
    if (!isDev) { showToast('❌ Только для разработчика', 'error'); return; }
    if (document.getElementById('consoleCodeInput').value.trim() === CONSOLE_CODE) {
      consoleUnlocked = true;
      document.getElementById('consoleMainUI').style.display = 'flex';
      document.getElementById('consoleLoginForm').style.display = 'none';
      startHackerBg();
      hackerInterval = setInterval(startHackerBg, 10000);
      consoleLog('success', '✅ Консоль разблокирована.');
    } else showToast('❌ Неверный код', 'error');
  }
  function lockConsole() { consoleUnlocked = false; document.getElementById('consoleMainUI').style.display = 'none'; document.getElementById('consoleLoginForm').style.display = 'flex'; stopHackerBg(); }
  function consoleLog(type, text) {
    const o = document.getElementById('consoleOutput');
    if (!o) return;
    const t = new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    o.innerHTML += `<div><span style="color:var(--text-dim);">[${t}]</span> <span style="color:${type==='error'?'var(--neon-pink)':type==='success'?'var(--neon-green)':'var(--neon-red)'};">${escapeHtml(text)}</span></div>`;
    o.scrollTop = o.scrollHeight;
  }
  function consoleQuickCmd(cmd) { document.getElementById('consoleCmdInput').value = cmd; executeConsoleCommand(); }
  function executeConsoleCommand() {
    if (!consoleUnlocked || !isDev) return;
    const input = document.getElementById('consoleCmdInput');
    const cmd = input.value.trim();
    if (!cmd) return;
    consoleLog('cmd', `➤ ${cmd}`);
    input.value = '';
  }
  function openCommandsModal() { /* ... */ }
  function startHackerBg() { /* ... */ }
  function stopHackerBg() { /* ... */ }

  function init() {
    appInitialized = true;
    initDevAccount();
    if (restoreSession()) { enterMainApp(); return; }
    document.getElementById('authScreen').style.display = 'flex';
  }
  connectFirebase().then(init).catch(e => {
    document.getElementById('serverStatusText').textContent = 'Ошибка подключения';
    showToast('❌ Проверьте firebase-config.js', 'error');
  });
</script>
</body>
</html>
